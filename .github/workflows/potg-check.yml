# 🎬 팟지 한 판 점검(읽기만) — 원격 세션은 Firebase가 네트워크 정책에 막혀 있어 GitHub 서버에서 대신 돌림
# 실행 = tools/.potg-check 파일 내용을 바꿔 main에 푸시(첫 줄에 날짜를 쓰면 그 날짜, 비우면 오늘) · 결과는 Actions 실행 기록에
# ⚠️ 공개 리포라 실행 기록(닉네임·킬 기록)이 누구나 보임 — 사장님 동의(2026-10-28)
name: potg-check
on:
  push:
    branches: [main]
    paths: ['tools/.potg-check']
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 팟지 점검
        run: TZ=Asia/Seoul node tools/potg-report.cjs $(head -1 tools/.potg-check | grep -oE '^[0-9]{4}-[0-9]{2}-[0-9]{2}' || true)
      - name: 리플레이 확인
        run: TZ=Asia/Seoul node tools/replay-report.cjs
