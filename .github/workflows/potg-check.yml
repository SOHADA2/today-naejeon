# 🎬 팟지 한 판 점검(읽기만) — 원격 세션은 Firebase가 네트워크 정책에 막혀 있어 GitHub 서버에서 대신 돌림
# 실행 = tools/.potg-check 파일 내용을 바꿔 main에 푸시(첫 줄에 날짜를 쓰면 그 날짜, 비우면 오늘) · 결과는 Actions 실행 기록에
# ⚠️ 공개 리포라 실행 기록(닉네임·킬 기록)이 누구나 보임 — 사장님 동의(2026-10-28)
name: potg-check
on:
  push:
    branches: [main]
    paths: ['tools/.potg-check']
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 팟지 점검
        run: TZ=Asia/Seoul node tools/potg-report.cjs $(head -1 tools/.potg-check | grep -oE '^[0-9]{4}-[0-9]{2}-[0-9]{2}' || true)
      - name: 날짜별 경기 기록
        run: TZ=Asia/Seoul node tools/days-report.cjs
      - name: 리플레이 확인
        run: TZ=Asia/Seoul node tools/replay-report.cjs
      - name: 롤 대기방 자리 확인
        run: TZ=Asia/Seoul node tools/lobby-report.cjs
  clip:
    # 🎬 팟지 영상 내용 확인 — ffprobe 정보 + 1초마다 한 장 캡처 모음을 potg-check-out 브랜치에 올림(사장님 동의: 공개)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 영상 받기·검사
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1 || true
          mkdir -p out
          TZ=Asia/Seoul node tools/clip-dump.cjs $(head -1 tools/.potg-check | grep -oE '^[0-9]{4}-[0-9]{2}-[0-9]{2}' || true) out
          for f in out/*.webm; do
            [ -e "$f" ] || continue
            echo "■ $f"; ffprobe -v error -show_entries format=duration:stream=codec_name,width,height,r_frame_rate,nb_frames -of compact "$f"
            ffmpeg -v error -i "$f" -vf "fps=1,scale=384:-1,drawtext=text='%{pts\\:hms}':x=6:y=6:fontsize=16:fontcolor=yellow:box=1:boxcolor=black@0.6,tile=4x6" -frames:v 1 "${f%.webm}.jpg" || ffmpeg -v error -i "$f" -vf "fps=1,scale=384:-1,tile=4x6" -frames:v 1 "${f%.webm}.jpg" || echo "캡처 실패"
            ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of compact "$f"
            ffprobe -v error -select_streams v:0 -show_entries packet=pts_time -of csv=p=0 "$f" | awk 'NR%15==1' | tr '\n' ' '; echo
            ffmpeg -v error -i "$f" -vf "fps=3,scale=256:-1,tile=6x10" -frames:v 1 "${f%.webm}-dense.jpg" || true
            ffmpeg -v error -i "$f" -vf blackdetect=d=0.5:pix_th=0.1 -an -f null - 2>&1 | head -5
          done
          ls -la out
      - name: 결과 올리기
        run: |
          cd out && ls *.jpg >/dev/null 2>&1 || exit 0
          git init -q -b potg-check-out
          git config user.name "potg-check" && git config user.email "potg-check@users.noreply.github.com"
          git add *.jpg *.json *.webm 2>/dev/null; git commit -qm "팟지 영상 캡처" || exit 0
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" potg-check-out
