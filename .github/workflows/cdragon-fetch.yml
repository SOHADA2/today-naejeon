# 🐉 CommunityDragon에서 롤 클라이언트 화면 파일(대기방·친구 목록·위 메뉴)을 받아 cdragon-out 브랜치에 올림
# 이유: 원격 작업 세션은 네트워크 정책으로 CommunityDragon이 막혀 있음 → 「내 팀」 마커 위치를 클라 화면 파일(CSS)로 계산하려고
name: cdragon-fetch
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/.cdragon-fetch']
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 받기
        run: |
          mkdir out && cd out
          B=https://raw.communitydragon.org/latest/plugins
          for p in rcp-fe-lol-lobby rcp-fe-lol-social rcp-fe-lol-navigation rcp-fe-lol-parties rcp-fe-lol-uikit rcp-fe-lol-l10n; do
            wget -q -r -np -nH --cut-dirs=2 -l 6 -e robots=off -A 'css,js,json,html,htm' -R 'index.html*' "$B/$p/global/default/" || true
          done
          find . -type f | head -400 > ../list.txt; wc -l ../list.txt; du -sh .
      - name: 올리기
        run: |
          cd out
          [ -n "$(ls -A)" ] || { echo '받은 파일 없음'; exit 1; }
          cp ../list.txt .
          git init -q -b cdragon-out && git add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "cdragon $(date -u +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" cdragon-out
