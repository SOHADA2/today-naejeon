<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>투데이 내전</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared.css">
  <link rel="stylesheet" href="../desktop/desktop.css">
  <link rel="stylesheet" href="sidepanel.css">
  <link rel="stylesheet" href="today.css">
</head>
<body>
  <div class="bg"></div>
  <div id="panel">
    <header id="sbar">
      <span class="s-ttl">투데이 내전</span>
      <span class="s-me" id="s-me" style="display:none;"></span>
      <span class="s-sp"></span>
      <button id="s-hostbtn" class="s-hostbtn" style="display:none;" title="방장 = 팀짜기·경기 기록·투표 마감 담당">👑 방장 하기</button>
      <button id="s-min" class="s-winbtn" title="최소화">–</button>
      <button id="s-close" class="s-winbtn" title="닫기">✕</button>
    </header>
    <!-- 👑 방장 메뉴(넘겨주기·그만하기) -->
    <div id="s-hostmenu" class="tn-hostmenu" style="display:none;"></div>
    <div id="sp-toast"></div>

    <!-- 입장 -->
    <section id="s-login" class="s-login" style="display:none;">
      <div class="slh"><div class="slh-crest">⚔️</div><div class="slh-title">투데이 내전</div><div class="slh-sub">오늘 하루의 내전</div></div>
      <div class="s-login-box">
        <div class="tn-wait"><span class="lobby-pulse"></span><b>롤 클라이언트를 켜고 로그인하면</b><br>그 계정으로 자동 입장돼요</div>
        <div class="slb-hint">같은 PC에서 다른 사람이 자기 계정으로 로그인하면<br>그 사람으로 자동으로 바뀌어요<br>투데이 내전 기록은 시즌 LP·골드와 따로 쌓여요</div>
      </div>
      <div class="app-ver" id="s-ver"></div>
    </section>

    <!-- 입장 후 -->
    <div class="app-shell" id="s-app" style="display:none;">
      <nav class="rail">
        <button class="rail-btn" data-cat="team" id="s-rail-team" style="display:none;"><span class="ri">⚔️</span><span class="rl">진행</span></button>
        <button class="rail-btn on" data-cat="today"><span class="ri">📅</span><span class="rl">오늘</span></button>
        <button class="rail-btn" data-cat="profile"><span class="ri">👤</span><span class="rl">프로필</span></button>
      </nav>
      <div class="cat">
        <!-- ⚔️ 팀짜기(방장) -->
        <section class="cat-view" id="cat-team">
          <div class="cat-hd">진행 <span class="cat-hd-sub">방장</span></div>
          <div class="cat-scroll ui-scroll">
            <!-- 진행 중인 판(팀 확정 이후) -->
            <div id="tb-live" style="display:none;"></div>
            <!-- 진행 중인 판이 없을 때 -->
            <div id="tb-idle">
              <div class="td-state">참가자·방식(랜덤/드래프트)·팀장은 <b>왼쪽 대기실</b>에서 정하고 시작해요.<br>모두가 같은 화면을 보고 있어요.</div>
              <button id="tb-open-lobby" class="btn-ghost">대기실 보기</button>
            </div>
            <div id="tb-err" class="tb-err" style="display:none;"></div>
          </div>
        </section>
        <!-- 👤 개인 내전 프로필 -->
        <section class="cat-view" id="cat-profile" style="display:none;">
          <div class="cat-hd"><span id="pf-title">내 프로필</span><button class="pf-back" id="pf-back" style="display:none;">내 프로필로</button></div>
          <div id="pf-body" class="cat-scroll ui-scroll"></div>
        </section>
        <!-- 📅 오늘 -->
        <section class="cat-view" id="cat-today" style="display:flex;">
          <div class="cat-hd"><button class="td-nav" id="td-prev" title="이전 날">‹</button><span id="td-day">오늘</span><button class="td-nav" id="td-next" title="다음 날">›</button></div>
          <div id="td-body" class="cat-scroll ui-scroll"></div>
        </section>
      </div>
    </div>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
