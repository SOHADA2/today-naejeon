<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>투데이 내전</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared.css">
  <link rel="stylesheet" href="../desktop/desktop.css">
  <link rel="stylesheet" href="sidepanel.css">
  <link rel="stylesheet" href="today.css">
</head>
<body>
  <div class="bg"></div>
  <div id="panel">
    <header id="sbar">
      <span class="s-ttl">투데이 내전</span>
      <span class="s-me" id="s-me" style="display:none;"></span>
      <span class="s-sp"></span>
      <button id="s-min" class="s-winbtn" title="최소화">–</button>
      <button id="s-close" class="s-winbtn" title="닫기">✕</button>
    </header>

    <!-- 입장 -->
    <section id="s-login" class="s-login" style="display:none;">
      <div class="slh"><div class="slh-crest">⚔️</div><div class="slh-title">투데이 내전</div><div class="slh-sub">오늘 하루의 내전 · 내 아이디로 입장</div></div>
      <div class="s-login-box">
        <div class="slb-label">계정 선택</div>
        <select id="s-entry-name"><option value="">— 아이디 선택 —</option></select>
        <button id="s-entry-go" class="ui-btn-gold slb-go" disabled>입장</button>
        <label class="s-host-login"><input type="checkbox" id="s-host"><span class="shl-tx"><b>👑 방장으로 입장</b><small>팀짜기·경기 기록·투표 마감을 담당</small></span></label>
        <div class="slb-hint">홈페이지에 등록된 <b>본인 닉네임</b>을 고르세요<br>투데이 내전 기록은 시즌 LP·골드와 따로 쌓여요</div>
      </div>
      <div class="app-ver" id="s-ver"></div>
    </section>

    <!-- 입장 후 -->
    <div class="app-shell" id="s-app" style="display:none;">
      <nav class="rail">
        <button class="rail-btn" data-cat="team" id="s-rail-team" style="display:none;"><span class="ri">⚔️</span><span class="rl">팀짜기</span></button>
        <button class="rail-btn on" data-cat="today"><span class="ri">📅</span><span class="rl">오늘</span></button>
      </nav>
      <div class="cat">
        <!-- ⚔️ 팀짜기(방장) -->
        <section class="cat-view" id="cat-team">
          <div class="cat-hd">팀 짜기 <span class="cat-hd-sub">방장</span></div>
          <div class="cat-scroll ui-scroll">
            <!-- 진행 중인 판(팀 확정 이후) -->
            <div id="tb-live" style="display:none;"></div>
            <!-- 참가자 고르기 -->
            <div id="tb-pick">
              <div class="tb-row">
                <span class="tb-count"><b id="tb-num">0</b>명 선택 <button id="tb-clear" title="전체 선택 해제">해제</button></span>
                <span class="tb-modes">
                  <label><input type="radio" name="tb-mode" value="balance" checked> 밸런스</label>
                  <label><input type="radio" name="tb-mode" value="random"> 랜덤</label>
                </span>
              </div>
              <div id="tb-list" class="tb-list"></div>
              <button id="tb-go" class="btn-gold" disabled>팀 구성</button>
              <div class="foot-hint">팀원 오버레이에 바로 팀이 떠요 · 11명 이상·홀수면 관전자 자동 선정</div>
            </div>
            <div id="tb-err" class="tb-err" style="display:none;"></div>
          </div>
        </section>
        <!-- 📅 오늘 -->
        <section class="cat-view" id="cat-today" style="display:flex;">
          <div class="cat-hd"><button class="td-nav" id="td-prev" title="이전 날">‹</button><span id="td-day">오늘</span><button class="td-nav" id="td-next" title="다음 날">›</button><span class="cat-hd-actions"><button class="s-change-btn" id="s-change" title="계정 변경">계정 변경</button></span></div>
          <div id="td-body" class="cat-scroll ui-scroll"></div>
        </section>
      </div>
    </div>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
