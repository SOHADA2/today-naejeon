<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>투데이 내전</title>
  <link rel="stylesheet" href="../shared.css">
  <link rel="stylesheet" href="sidepanel.css">
  <link rel="stylesheet" href="today.css">
</head>
<body>
  <!-- 오른쪽 창(v0.1.197 다시 설계 · 사장님: 왼쪽 창의 새 레이아웃·디자인을 오른쪽에도 · 시인성 · 처음 켰을 때 보여 줄 화면 · 글 줄이기)
       머리 → 탭 4개(홈 · 기록 · 프로필 · 증강) → 내용(스크롤은 여기만) → 꼬리(버전)
       홈 = 첫 화면: 나(티어) · 이번 판(진행 중일 때 · 방장 조작) · 오늘 · 바로 가기 / 증강 = 가이드 · 패치 노트 · 뽑아 보기 -->
  <div id="panel">
    <header id="sbar"><div class="hd-bg" aria-hidden="true"><span>TODAY IN-HOUSE</span></div>
      <span class="s-brand"><span class="s-brand-tx"><span class="s-brand-en">TODAY IN-HOUSE</span><span class="s-ttl">투데이 내전</span></span></span>
      <span class="s-sp"></span>
      <button id="s-min" class="s-winbtn tn-wb" title="최소화"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M1.5 6h9" stroke="currentColor" stroke-width="1.4"/></svg></button>
      <button id="s-close" class="s-winbtn tn-wb x" title="닫기"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.4"/></svg></button>
    </header>
    <div id="sp-toast"></div>

    <nav class="sp-tabs" id="sp-tabs">
      <button class="sp-tab on" data-cat="home">홈</button>
      <button class="sp-tab" data-cat="today">기록</button>
      <button class="sp-tab" data-cat="profile">프로필</button>
      <button class="sp-tab" data-cat="aug">증강</button>
    </nav>

    <main class="sp-main">
      <!-- 증강 묶음(가이드 · 패치 노트 · 뽑아 보기)일 때만 보이는 작은 갈래 줄 -->
      <div class="sp-seg" id="sp-seg" style="display:none;">
        <button data-cat="aug">가이드</button><button data-cat="patch">패치 노트</button><button data-cat="lab">뽑아 보기</button>
      </div>

      <!-- 홈(첫 화면) -->
      <section class="cat-view" id="cat-home" style="display:flex;">
        <div id="hm-body" class="cat-scroll ui-scroll"></div>
      </section>
      <!-- 기록(날짜별 순위 · 경기 · 같이 한 일반 판) -->
      <section class="cat-view" id="cat-today" style="display:none;">
        <div class="sp-bar">
          <button class="sp-nav" id="td-prev" title="이전 날"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M7.5 2 3.5 6l4 4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
          <div class="sp-bar-tx"><span class="sp-en">RECORD</span><b id="td-day">오늘</b></div>
          <button class="sp-nav" id="td-next" title="다음 날"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M4.5 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
        </div>
        <div id="td-body" class="cat-scroll ui-scroll"></div>
      </section>
      <!-- 프로필 -->
      <section class="cat-view" id="cat-profile" style="display:none;">
        <div id="pf-body" class="cat-scroll ui-scroll"></div>
      </section>
      <!-- 증강: 가이드 -->
      <section class="cat-view" id="cat-aug" style="display:none;">
        <div id="ag-ed" class="cat-scroll ui-scroll"></div>
      </section>
      <!-- 증강: 패치 노트 -->
      <section class="cat-view" id="cat-patch" style="display:none;">
        <div id="pn-body" class="cat-scroll ui-scroll"></div>
      </section>
      <!-- 증강: 뽑아 보기 -->
      <section class="cat-view" id="cat-lab" style="display:none;">
        <div id="al-body" class="cat-scroll ui-scroll"></div>
      </section>
    </main>
    <footer class="sp-foot" id="s-ver"></footer>
  </div>
  <script src="../desktop/tip.js"></script>
  <script src="../desktop/settings.js"></script>
  <script src="sidepanel.js"></script>
  <script src="augguide.js"></script>
  <script src="patchnotes.js"></script>
  <script src="auglab.js"></script>
  <script src="../overlay/tierreveal.js"></script>
</body>
</html>
