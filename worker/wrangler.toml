# 투데이 내전 영상 중계 — 배포: cd worker && npx wrangler deploy · 토큰: npx wrangler secret put GH_TOKEN
name = "today-naejeon-clips"
main = "clips-proxy.js"
compatibility_date = "2024-09-23"
workers_dev = true

[vars]
REPO = "SOHADA2/today-naejeon-clips"
REQUIRE_AUTH = "0"   # 친구들 앱 v0.1.99+ 되면 "1"(표식 없는 요청 거절)

[triggers]
crons = ["0 21 * * *"]   # 매일 한국 새벽 6시 = 3일 지난 영상 정리

# 🛡️ 같은 IP 1분 제한(clips-proxy.js route) — 올리기 10번 · 받기 40번
[[unsafe.bindings]]
name = "UP_LIMIT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[unsafe.bindings]]
name = "GET_LIMIT"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 40, period = 60 }
