<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>투데이 내전</title>
  <link rel="stylesheet" href="../shared.css">
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <div id="panel">
    <header id="bar"><div class="hd-bg" aria-hidden="true"><span>TODAY IN-HOUSE</span></div>
      <span class="brand"><img class="brand-mk" src="../assets/mark.png" alt=""><span class="brand-tx"><span class="brand-en">TODAY IN-HOUSE</span><span class="ttl">투데이 내전</span></span></span>
      <span id="phase" class="phase">대기</span>
      <button id="ov-min" class="win-btn tn-wb" title="최소화"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M1.5 6h9" stroke="currentColor" stroke-width="1.4"/></svg></button>
      <button id="close" class="win-btn tn-wb x" title="닫기 (Shift+F7)"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.4"/></svg></button>
    </header>
    <div id="hn" class="hn" style="display:none;"></div>

    <!-- 팀 배정 뷰 -->
    <section id="view-team" class="view" style="display:none;">
      <div id="tv-band" class="tv-band"></div>
      <div class="ta-teams">
        <div class="ta-team blue" id="team1">
          <div class="ta-color-bar"></div>
          <div class="ta-head"><span class="ta-label">1팀</span><span class="ta-count" id="t1-count"></span></div>
          <ul class="ta-players" id="t1-players"></ul>
        </div>
        <div class="ta-team red" id="team2">
          <div class="ta-color-bar"></div>
          <div class="ta-head"><span class="ta-label">2팀</span><span class="ta-count" id="t2-count"></span></div>
          <ul class="ta-players" id="t2-players"></ul>
        </div>
      </div>
      <div id="tv-bal" class="tv-bal" style="display:none;"></div>
      <div id="tv-map" class="tv-map" style="display:none;"></div>   <!-- 🎮 v0.1.188 이번 판 다리 -->
      <div id="tv-dc" class="tv-dc" style="display:none;"></div>
      <div id="tv-hspec" class="lb-hspec" style="display:none;"></div>
      <div id="tv-pending" class="tv-pending" style="display:none;"></div>
      <button id="tv-cancel" class="ui-btn-ghost tv-cancel" style="display:none;">팀 취소하고 대기실로</button>
    </section>

    <!-- 🎯 드래프트 픽 -->
    <section id="view-draft" class="view ui-scroll" style="display:none;">
      <div id="dr-band" class="dr-band"></div>
      <div class="dr-bar-track"><div id="dr-bar" class="dr-bar"></div></div>
      <div id="dr-order" class="dr-order"></div>
      <div id="dr-map" class="dr-map" style="display:none;"></div>   <!-- 🎮 v0.1.188 선픽 아닌 팀장이 다리 고르기 -->
      <div class="dr-teams">
        <div class="dr-team blue" id="dr-a"></div>
        <div class="dr-team red" id="dr-b"></div>
      </div>
      <div class="dr-pool-h" id="dr-pool-h"></div>
      <div class="dr-pool" id="dr-pool"></div>
      <div class="dr-err" id="dr-err" style="display:none;"></div>
      <button id="dr-cancel" class="ui-btn-ghost tv-cancel" style="display:none;">드래프트 취소하고 대기실로</button>
    </section>

    <!-- 🎯 드래프트 픽 연출(한 명 뽑힐 때마다 한 번) -->
    <div id="pk" class="pk-layer" style="display:none;">
      <div class="pk-band" id="pk-band"><i class="pk-shine" id="pk-shine"></i></div>
      <div class="pk-card" id="pk-card"></div>
    </div>

    <!-- 🪙 선픽 동전 던지기(드래프트 시작 때 한 번) -->
    <div id="coin" class="coin-layer" style="display:none;">
      <div class="cn-head"><span class="cn-en">COIN TOSS</span><span class="cn-ttl">선픽 동전 던지기</span><span class="cn-sub">사미라가 동전을 던져요</span></div>
      <div class="cn-vs" id="cn-vs"></div>
      <div class="cn-stage">
        <div class="cn-shadow" id="cn-shadow"></div>
        <div class="cn-pos" id="cn-pos"><div class="cn-glow" id="cn-glow"><div class="cn-wob" id="cn-wob"><div class="cn-spin" id="cn-spin">
          <i class="cn-edge" style="--z:-3px"></i><i class="cn-edge" style="--z:-1.5px"></i><i class="cn-edge" style="--z:0px"></i><i class="cn-edge" style="--z:1.5px"></i><i class="cn-edge" style="--z:3px"></i>
          <img class="cn-face f1" src="../assets/coin-t1.webp" alt="">
          <img class="cn-face f2" src="../assets/coin-t2.webp" alt="">
        </div></div></div></div>
      </div>
      <div class="cn-res" id="cn-res"></div>
    </div>

    <!-- 📼 게임 끝난 뒤 기록 저장 중 -->
    <section id="view-rec" class="view ui-scroll" style="display:none;">
      <div id="rc-head" class="rc-head"></div>
      <ol id="rc-steps" class="rc-steps"></ol>
      <div id="rc-note" class="rc-note"></div>
      <div id="rc-host" class="rc-host" style="display:none;"></div>
    </section>

    <!-- 🗳️ MVP·매너왕 투표 -->
    <section id="view-vote" class="view ui-scroll" style="display:none;">
      <div id="vt-banner" class="vt-banner"></div>
      <div id="vt-body"></div>
      <div id="vt-progress" class="vt-progress"></div>
    </section>

    <!-- 🏁 결과 -->
    <section id="view-result" class="view ui-scroll" style="display:none;">
      <div id="st-banner" class="st-banner"></div>
      <div id="st-awards" class="st-awards"></div>
      <div id="st-teams" class="st-teams"></div>
      <button id="st-potg" class="ui-btn-gold" style="display:none;">팟지 다시 보기</button>
      <button id="st-close" class="ui-btn-ghost">확인</button>
    </section>

    <!-- 🚪 대기실 — 접속한 사람 모두가 같은 화면
         v0.1.196(사장님: 효율·직관·시인성 · 자주 쓰는 기능과 처음 온 사람) = 두 구역:
         위 lb-body = 방과 사람(방 줄 · 자리 · 관전) / 아래 lb-dock(늘 창 아래 고정) = 이번 판(방장: 안내 한 줄 + [방식 ▾][시작] · 팀원: 지금 방식·무엇을 기다리는지 · 방장 없음: 「방장 하기」) -->
    <section id="view-lobby" class="view" style="display:none;">
      <div class="lb-body ui-scroll">
        <div id="lb-head" class="lb-head"></div>
        <div id="lb-hostmenu" class="lb-hostmenu" style="display:none;"></div>
        <div id="lb-login" class="lb-login" style="display:none;"></div>   <!-- 롤 로그인 전 = 시작하는 법 3단계 -->
        <div id="lb-seats" class="lb-seats"></div>
        <div id="lb-list" class="lb-list"></div>
        <div id="lb-hspec" class="lb-hspec" style="display:none;"></div>
        <div id="lb-me" class="lb-me"><button id="lb-mebtn" class="lb-mebtn"></button></div>
        <div id="lb-upd" class="lb-upd" style="display:none;"></div>
        <div id="lb-today" class="lb-today"></div>
      </div>
      <div id="lb-dock" class="lb-dock" style="display:none;">
        <!-- 💬 채팅(v0.1.202) — 글 = 입력 칸 위 「최근 말」 줄 · 이모티콘 = 누르면 그 사람 자리에서 뜸 · ▾ 로 접으면 한 줄(접힌 동안 누가 쓰면 반짝) · 기록은 안 남음 -->
        <div id="lb-chat" class="lb-chat" style="display:none;">
          <button id="lb-chat-fold" class="lb-chat-fold" style="display:none;" title="채팅 펴기 (Enter)"><span class="lb-chat-ftt">채팅</span><span id="lb-chat-pv" class="lb-chat-pv"></span><b id="lb-chat-new" class="lb-chat-new" style="display:none;"></b><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 7.5 6 4l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
          <div id="lb-chat-box" class="lb-chat-box">
            <div id="lb-chat-feed" class="lb-chat-feed"></div>
            <div class="lb-chat-emo"><span id="lb-chat-emo" class="lb-chat-emos"></span><button id="lb-chat-dn" class="lb-chat-dn" title="채팅 접기"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button></div>
            <div class="lb-chat-row"><input id="lb-chat-in" class="lb-chat-in" maxlength="50" placeholder="한마디 · Enter" autocomplete="off" spellcheck="false"><button id="lb-chat-go" class="lb-chat-go" title="보내기"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6h7M6 2.5 9.5 6 6 9.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button></div>
          </div>
        </div>
        <!-- 방식 고르는 창(방장) — 방식 버튼 바로 위로 열림 -->
        <div id="lb-mpop" class="lb-mpop" style="display:none;">
          <div class="lb-mp-row"><span class="lb-mode-l">이번 판</span><button class="lb-kind" data-kind="inhouse" title="우리끼리 1팀 vs 2팀(롤 사용자 설정 게임)">내전</button><button class="lb-kind" data-kind="normal" title="내전 말고 같은 팀으로 일반 게임(아수라장 등)을 할 때 · 판 기록·하이라이트 자동">일반</button></div>
          <div class="lb-mp-row" id="lb-sub"><span class="lb-mode-l">팀 짜기</span><span class="lb-mp-grid"><button class="lb-seg" data-mode="random">랜덤</button><button class="lb-seg" data-mode="balance">밸런스</button><button class="lb-seg" data-mode="draft">드래프트</button><button class="lb-seg" data-mode="manual">직접</button></span></div>
          <div class="lb-mp-row" id="lb-nq"><span class="lb-mode-l">큐</span><span class="lb-mp-grid"><button class="lb-qb" data-q="2400">아수라장</button><button class="lb-qb" data-q="450">칼바람 나락</button></span></div>
          <div id="lb-mdesc" class="lb-mp-desc"></div>
        </div>
        <div id="lb-lol" class="lb-lol" style="display:none;"></div>   <!-- 🎮 방장 롤 초대 수락(자동 수락을 끈 사람) -->
        <div id="lb-err" class="dr-err" style="display:none;"></div>
        <div id="lb-caps" class="lb-caps" style="display:none;"></div>   <!-- 방장 안내 한 줄: 팀장 n/2·랜덤 팀장 / 1팀·2팀·미정 / 롤 파티 n/5·다시 초대 / 남는 사람 -->
        <div id="lb-gobar" class="lb-gobar" style="display:none;"><button id="lb-mchip" class="lb-mchip"></button><button id="lb-start" class="ui-btn-gold lb-start" disabled>시작</button></div>
        <div id="lb-stat" class="lb-stat" style="display:none;"></div>   <!-- 팀원: 방식 · 방장 · 무엇을 기다리는지 / 방장 없음: 방장 하기 -->
      </div>
    </section>

    <!-- 🚪 방 목록(v0.1.94) — 방에 들어가기 전 · 방 만들기(만든 사람 = 방장) · 비공개 = 비밀번호 -->
    <section id="view-rooms" class="view ui-scroll" style="display:none;">
      <div class="lb-head"><span class="lb-title"><span class="lb-en">ROOMS</span><b>방 목록</b></span><button id="rm-new" class="lb-mini">＋ 방 만들기</button></div>
      <div id="rm-form" class="rm-form" style="display:none;">
        <input id="rm-name" class="rm-in" maxlength="20" placeholder="방 이름">
        <div class="rm-priv"><button class="rm-seg on" data-priv="0">공개</button><button class="rm-seg" data-priv="1">비공개</button></div>
        <input id="rm-pw" class="rm-in" maxlength="20" placeholder="비밀번호" type="password" style="display:none;">
        <div class="rm-actions"><button id="rm-cancel" class="lb-mini plain">취소</button><button id="rm-go" class="ui-btn-gold rm-go">만들고 들어가기</button></div>
      </div>
      <div id="rm-err" class="dr-err" style="display:none;"></div>
      <div id="rm-list" class="rm-list"></div>
    </section>

    <!-- 게임 중 명단 -->
    <section id="view-roster" class="view ui-scroll">
      <div id="status" class="status"></div>
      <div id="waiting-info" class="waiting-info"></div>
      <div class="section-h" id="roster-h" style="display:none;">참가자 <span id="pcount"></span></div>
      <ul id="players" class="players"></ul>
    </section>

    <footer>Shift+F7 토글 · 헤더 드래그로 이동</footer>
  </div>
  <script type="importmap">{ "imports": { "three": "../vendor/three/three.module.min.js", "three/addons/": "../vendor/three/addons/" } }</script>
  <script type="module" src="coin3d.js"></script>
  <script src="../desktop/tip.js"></script>
  <script src="../desktop/settings.js"></script>
  <script src="overlay.js"></script>
  <script src="tutorial.js"></script>
  <script src="tierreveal.js"></script>
</body>
</html>
