<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../shared.css">
  <style>
    * { margin:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; background:transparent; overflow:hidden; -webkit-user-select:none; font-family:var(--f-body); }
    /* 📍 v0.1.221 롤 클라이언트 화면 위 핑(사장님: 클라이언트 쪽도) — 롤 클라 창 전체를 덮는 클릭 통과 투명 창
       좌표 = 롤 기준 1280×720(main이 zoom = 클라 폭/1280 으로 키움) · 바퀴·핑 모양은 왼쪽 대기실 핑과 같음(v0.1.256 스케치 그림 · 대기실용 뜻 8방향 + 가운데)
       main → cping {type:'wheel'(x,y) | 'move'(x,y,sel) | 'end' | 'show'(k,fx,fy,name) | 'err'(x,y,text)}
       ⚠️ 무한 애니메이션 금지(투명 창) — 핑·바퀴 효과는 한 번만 */
    #root { position:absolute; inset:0; }
    .pw { position:absolute; left:0; top:0; width:0; height:0; display:none; --pc:#22a7f0; --R:216px; --cr:76px; }
    .pw.open { display:block; }
    .pw .bg { position:absolute; left:calc(var(--R) * -1); top:calc(var(--R) * -1); width:calc(var(--R) * 2); height:calc(var(--R) * 2); background:url(../assets/ping/wheel.png) center / 100% 100% no-repeat; opacity:.92; }   /* ✏️ v0.1.256 손그림 바퀴 */
    .pw .s { position:absolute; left:calc(var(--R) * -1); top:calc(var(--R) * -1); width:calc(var(--R) * 2); height:calc(var(--R) * 2); border-radius:50%; opacity:0;
      background:repeating-linear-gradient(-35deg, rgba(255,255,255,.16) 0 2px, transparent 2px 7px), conic-gradient(from calc(var(--r) - 22.5deg), color-mix(in srgb, var(--pc) 34%, transparent) 0 45deg, transparent 45deg);
      -webkit-mask:conic-gradient(from calc(var(--r) - 22.5deg), #000 0 45deg, transparent 45deg), radial-gradient(circle closest-side, transparent 0 calc(var(--cr) + 3px), #000 calc(var(--cr) + 4px) 93%, transparent 94%); -webkit-mask-composite:source-in; }
    .pw .s.on { opacity:1; }
    .pw .i { position:absolute; width:40px; height:40px; margin:-20px 0 0 -20px; opacity:.92; transition:transform .08s; }
    .pw .i.mute { filter:grayscale(1) sepia(.5) brightness(1.35) drop-shadow(0 1px 2px rgba(0,0,0,.9)); opacity:.85; }
    .pw .i.on { opacity:1; transform:scale(1.32) rotate(-6deg); }
    .pw .ctr { position:absolute; left:calc(var(--cr) * -1); top:calc(var(--cr) * -1); width:calc(var(--cr) * 2); height:calc(var(--cr) * 2); border-radius:50%;
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
      background:none; }
    .pw .ci { width:40px; height:40px; }
    .pw .t { font-size:16px; font-weight:700; white-space:nowrap; color:var(--pc); text-shadow:0 1px 2px #000; }
    .pw .ctr small { display:flex; align-items:center; gap:4px; font-size:12px; color:#8b8f94; }
    .pw .ms { width:9px; height:13px; }
    .wp { position:absolute; width:0; height:0; --pc:#3aa0ff; }
    .wp .g { position:absolute; left:-32px; top:-13px; width:64px; height:26px; border-radius:50%; border:2px dashed #f4efe4; opacity:0; animation:wpG .8s ease-out forwards; }
    .wp .g2 { border-color:var(--pc); }
    .wp .g2 { animation-delay:.32s; }
    .wp .sb { display:none; }
    .wp .ic { position:absolute; left:-28px; top:-62px; width:56px; height:56px; filter:drop-shadow(0 2px 3px rgba(0,0,0,.6)); animation:wpI .55s cubic-bezier(.3,1.6,.5,1) both; }
    .wp .nm { position:absolute; left:50%; top:15px; transform:translateX(-50%); padding:0 6px; font-size:11.5px; font-weight:800; white-space:nowrap; color:var(--pc);
      background:rgba(4,9,15,.85); border:1px dashed rgba(244,239,228,.45); animation:wpN .3s .25s ease-out both; }
    .er { position:absolute; transform:translate(-50%, 18px); padding:2px 9px; font-size:12px; font-weight:800; white-space:nowrap; color:#ff8a8a; background:rgba(4,9,15,.9); border:1px solid rgba(255,90,110,.6); }
    @keyframes wpG { 0% { opacity:1; transform:scale(.25); } 100% { opacity:0; transform:scale(1.45); } }
    @keyframes wpS { 0% { opacity:0; transform:scaleY(.2); transform-origin:bottom; } 30% { opacity:.9; } 100% { opacity:0; transform:scaleY(1.2); transform-origin:bottom; } }
    @keyframes wpI { 0% { opacity:0; transform:translateY(-26px) scale(.6) rotate(-12deg); } 55% { opacity:1; transform:translateY(2px) scale(1.12) rotate(5deg); } 100% { transform:none; } }
    @keyframes wpN { from { opacity:0; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const PING = {
      look: { t: '여기 봐요', c: '#7cc6ff', img: 'look' },
      ready: { t: '준비 완료', c: '#7be0b0', img: 'ready' },
      go: { t: '가자!', c: '#ff9f5a', img: 'go' },
      good: { t: '좋아요', c: '#a7e36b', img: 'good' },
      lol: { t: 'ㅋㅋ', c: '#ffd56b', img: 'lol' },
      wait: { t: '잠깐만', c: '#b9a4ff', img: 'wait' },
      sorry: { t: '미안', c: '#9fd8ff', img: 'sorry' },
      ask: { t: '?', c: '#ffc24d', img: 'ask' },
      thanks: { t: '고마워', c: '#ff9ccc', img: 'thanks' },
    };
    const DIR = ['ready', 'go', 'good', 'lol', 'wait', 'sorry', 'ask', 'thanks'], R = 116, MS = 2600, MUTE = [];   // ✏️ v0.1.256 대기실용 스케치 핑(overlay.js PING과 같음)
    const img = k => `../assets/ping/${(PING[k] || PING.look).img}.png`;
    const root = document.getElementById('root');
    for (const k of Object.keys(PING)) { const i = new Image(); i.src = img(k); }   // 미리 읽어 둠(첫 핑이 늦게 안 뜨게)
    let pw = null;
    function wheel() {
      if (pw) return pw;
      pw = document.createElement('div'); pw.className = 'pw';
      pw.innerHTML = '<div class="bg"></div>' + DIR.map((k, i) => `<div class="s" data-k="${k}" style="--r:${i * 45}deg;--pc:${PING[k].c}"></div>`).join('')
        + DIR.map((k, i) => { const a = (i * 45 - 90) * Math.PI / 180; return `<img class="i${MUTE.includes(k) ? ' mute' : ''}" data-k="${k}" src="${img(k)}" style="left:${(Math.cos(a) * R).toFixed(1)}px;top:${(Math.sin(a) * R).toFixed(1)}px" alt="">`; }).join('')
        + `<div class="ctr"><img class="ci" src="${img('look')}" alt=""><b class="t"></b><small><svg class="ms" viewBox="0 0 10 14"><rect x=".7" y=".7" width="8.6" height="12.6" rx="4.3" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M5 .7v5.2h4.3V5A4.3 4.3 0 0 0 5 .7z" fill="currentColor"/></svg>뒤로</small></div>`;
      root.appendChild(pw); return pw;
    }
    let ox = 0, oy = 0;
    function sel(k) {
      const w = wheel();
      w.querySelectorAll('[data-k]').forEach(s => s.classList.toggle('on', s.dataset.k === k));
      w.style.setProperty('--pc', (PING[k] || PING.look).c);
      w.querySelector('.ci').src = img(k);
      w.querySelector('.t').textContent = (PING[k] || PING.look).t;
    }
    function show(d) {
      const P = PING[d.k]; if (!P) return;
      const e = document.createElement('div'); e.className = 'wp'; e.style.setProperty('--pc', P.c);
      e.style.left = (d.fx * 1280) + 'px'; e.style.top = (d.fy * 720) + 'px';
      e.innerHTML = `<i class="g"></i><i class="g g2"></i><i class="sb"></i><img class="ic" src="${img(d.k)}" alt=""><b class="nm"></b>`;
      e.querySelector('.nm').textContent = (d.name ? d.name + ' · ' : '') + P.t;
      root.appendChild(e);
      e.animate([{ opacity: 1 }, { opacity: 1, offset: 0.82 }, { opacity: 0 }], { duration: MS, fill: 'forwards' });
      setTimeout(() => e.remove(), MS + 100);
      if (d.vol > 0) try { const a = new Audio(`../assets/ping/sfx/${d.k}.ogg`); a.volume = Math.min(1, 0.14 * d.vol);   /* ≈ −32 LUFS · overlay PING_VOL과 같게 */ a.play().catch(() => {}); } catch (_) {}   // 🔊 롤 핑 소리(v0.1.224)
      const all = root.querySelectorAll('.wp'); if (all.length > 14) all[0].remove();
    }
    function onMsg(d) {
      if (!d) return;
      if (d.type === 'wheel') { const w = wheel(); ox = d.x; oy = d.y; w.style.left = d.x + 'px'; w.style.top = d.y + 'px'; w.classList.add('open'); sel('look'); }
      else if (d.type === 'move' && pw) sel(d.sel);
      else if (d.type === 'end' && pw) pw.classList.remove('open');
      else if (d.type === 'show') show(d);
      else if (d.type === 'err') { const e = document.createElement('div'); e.className = 'er'; e.textContent = d.text || ''; e.style.left = d.x + 'px'; e.style.top = d.y + 'px'; root.appendChild(e); setTimeout(() => e.remove(), 1800); }
    }
    if (window.api && window.api.onCping) window.api.onCping(onMsg);
    else {   // 🎨 목업(브라우저 직접 열기)
      document.body.style.background = '#0a1712';
      onMsg({ type: 'show', k: 'ask', fx: .3, fy: .45, name: '애긔반달곰' });
      onMsg({ type: 'wheel', x: 800, y: 380 }); onMsg({ type: 'move', sel: 'ask', x: 750, y: 382 });
    }
  </script>
</body>
</html>
