<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../shared.css">
  <style>
    * { margin:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; background:transparent; overflow:hidden; -webkit-user-select:none; font-family:var(--f-body); }
    /* 📍 v0.1.221 롤 클라이언트 화면 위 핑(사장님: 클라이언트 쪽도) — 롤 클라 창 전체를 덮는 클릭 통과 투명 창
       좌표 = 롤 기준 1280×720(main이 zoom = 클라 폭/1280 으로 키움) · 바퀴·핑 모양은 왼쪽 대기실 핑(v0.1.220)과 같음(롤 스마트 핑 8방향 + 가운데 · 그림 = 롤 핑 그림)
       main → cping {type:'wheel'(x,y) | 'move'(x,y,sel) | 'end' | 'show'(k,fx,fy,name) | 'err'(x,y,text)}
       ⚠️ 무한 애니메이션 금지(투명 창) — 핑·바퀴 효과는 한 번만 */
    #root { position:absolute; inset:0; }
    .pw { position:absolute; left:0; top:0; width:0; height:0; display:none; --pc:#3aa0ff; }
    .pw.open { display:block; }
    .pw .bg { position:absolute; left:-84px; top:-84px; width:168px; height:168px; border-radius:50%;
      background:radial-gradient(circle, rgba(4,9,15,.3) 0 17%, rgba(4,9,15,.86) 18% 58%, rgba(4,9,15,.8) 59% 70%, transparent 71%);
      box-shadow:0 0 0 1px rgba(160,175,190,.22) inset; }
    .pw .bg::after { content:''; position:absolute; inset:15px; border-radius:50%; border:1px solid rgba(160,175,190,.18); }
    .pw .s { position:absolute; left:-84px; top:-84px; width:168px; height:168px; border-radius:50%; opacity:0;
      background:conic-gradient(from calc(var(--r) - 22.5deg), color-mix(in srgb, var(--pc) 55%, transparent) 0 45deg, transparent 45deg);
      -webkit-mask:radial-gradient(circle, transparent 0 18%, #000 19% 70%, transparent 71%); }
    .pw .s.on { opacity:1; }
    .pw svg { position:absolute; left:0; top:0; width:1px; height:1px; overflow:visible; }
    .pw line { stroke:var(--pc); stroke-width:2.2; stroke-linecap:round; filter:drop-shadow(0 0 3px var(--pc)); }
    .pw .i { position:absolute; width:40px; height:40px; margin:-20px 0 0 -20px; opacity:.72; filter:drop-shadow(0 1px 2px rgba(0,0,0,.9)); transition:transform .08s, opacity .08s; }
    .pw .i.on { opacity:1; transform:scale(1.32); filter:drop-shadow(0 0 6px var(--pc)); }
    .pw .c { position:absolute; left:-16px; top:-16px; width:32px; height:32px; opacity:.6; }
    .pw .c.on { opacity:1; transform:scale(1.25); filter:drop-shadow(0 0 5px var(--pc)); }
    .pw .t { position:absolute; left:50%; top:90px; transform:translateX(-50%); padding:1px 9px; font-size:12.5px; font-weight:800; white-space:nowrap; color:#fff;
      background:rgba(4,9,15,.85); border:1px solid color-mix(in srgb, var(--pc) 70%, transparent); text-shadow:0 1px 2px #000; }
    .wp { position:absolute; width:0; height:0; --pc:#3aa0ff; }
    .wp .g { position:absolute; left:-32px; top:-13px; width:64px; height:26px; border-radius:50%; border:2px solid var(--pc); opacity:0;
      box-shadow:0 0 9px var(--pc), inset 0 0 7px var(--pc); animation:wpG .8s ease-out forwards; }
    .wp .g2 { animation-delay:.32s; }
    .wp .sb { position:absolute; left:-1.5px; top:-46px; width:3px; height:46px; opacity:0; background:linear-gradient(0deg, var(--pc), transparent); animation:wpS .55s .05s ease-out forwards; }
    .wp .ic { position:absolute; left:-28px; top:-64px; width:56px; height:56px; filter:drop-shadow(0 0 1px #000) drop-shadow(0 0 1px #000) drop-shadow(0 3px 4px rgba(0,0,0,.75)); animation:wpI .5s cubic-bezier(.3,1.5,.55,1) both; }
    .wp .nm { position:absolute; left:50%; top:15px; transform:translateX(-50%); padding:0 6px; font-size:11.5px; font-weight:800; white-space:nowrap; color:var(--pc);
      background:rgba(4,9,15,.8); text-shadow:0 1px 2px #000; animation:wpN .3s .25s ease-out both; }
    .er { position:absolute; transform:translate(-50%, 18px); padding:2px 9px; font-size:12px; font-weight:800; white-space:nowrap; color:#ff8a8a; background:rgba(4,9,15,.9); border:1px solid rgba(255,90,110,.6); }
    @keyframes wpG { 0% { opacity:1; transform:scale(.25); } 100% { opacity:0; transform:scale(1.45); } }
    @keyframes wpS { 0% { opacity:0; transform:scaleY(.2); transform-origin:bottom; } 30% { opacity:.9; } 100% { opacity:0; transform:scaleY(1.2); transform-origin:bottom; } }
    @keyframes wpI { 0% { opacity:0; transform:translateY(-30px) scale(1.4); } 55% { opacity:1; } 100% { transform:none; } }
    @keyframes wpN { from { opacity:0; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const PING = {
      look: { t: '주의', c: '#f5b400', img: 'caution' },
      retreat: { t: '후퇴', c: '#e8344a', img: 'retreat' },
      push: { t: '밀어붙이기', c: '#20c97a', img: 'push' },
      omw: { t: '가는 중', c: '#22a7f0', img: 'omw' },
      allin: { t: '올인', c: '#f5b400', img: 'all_in' },
      assist: { t: '도움 요청', c: '#20c97a', img: 'assist' },
      vision: { t: '시야 필요', c: '#20c97a', img: 'vision' },
      missing: { t: '적 실종', c: '#f5b400', img: 'missing' },
      enemy: { t: '적 시야', c: '#e8344a', img: 'enemy' },
    };
    const DIR = ['retreat', 'push', 'omw', 'allin', 'assist', 'vision', 'missing', 'enemy'], R = 58, MS = 2600;
    const img = k => `../assets/ping/${(PING[k] || PING.look).img}.png`;
    const root = document.getElementById('root');
    for (const k of Object.keys(PING)) { const i = new Image(); i.src = img(k); }   // 미리 읽어 둠(첫 핑이 늦게 안 뜨게)
    let pw = null;
    function wheel() {
      if (pw) return pw;
      pw = document.createElement('div'); pw.className = 'pw';
      pw.innerHTML = '<div class="bg"></div>' + DIR.map((k, i) => `<div class="s" data-k="${k}" style="--r:${i * 45}deg;--pc:${PING[k].c}"></div>`).join('')
        + '<svg><line x1="0" y1="0" x2="0" y2="0"/></svg>'
        + DIR.map((k, i) => { const a = (i * 45 - 90) * Math.PI / 180; return `<img class="i" data-k="${k}" src="${img(k)}" style="left:${(Math.cos(a) * R).toFixed(1)}px;top:${(Math.sin(a) * R).toFixed(1)}px" alt="">`; }).join('')
        + `<img class="c" data-k="look" src="${img('look')}" alt=""><b class="t"></b>`;
      root.appendChild(pw); return pw;
    }
    let ox = 0, oy = 0;
    function sel(k, x, y) {
      const w = wheel();
      w.querySelectorAll('[data-k]').forEach(s => s.classList.toggle('on', s.dataset.k === k));
      w.style.setProperty('--pc', (PING[k] || PING.look).c);
      w.querySelector('.t').textContent = (PING[k] || PING.look).t;
      const dx = x - ox, dy = y - oy, d = Math.hypot(dx, dy), L = Math.min(d, R + 14), ln = w.querySelector('line');
      ln.setAttribute('x2', d ? (dx / d * L).toFixed(1) : 0); ln.setAttribute('y2', d ? (dy / d * L).toFixed(1) : 0);
    }
    function show(d) {
      const P = PING[d.k]; if (!P) return;
      const e = document.createElement('div'); e.className = 'wp'; e.style.setProperty('--pc', P.c);
      e.style.left = (d.fx * 1280) + 'px'; e.style.top = (d.fy * 720) + 'px';
      e.innerHTML = `<i class="g"></i><i class="g g2"></i><i class="sb"></i><img class="ic" src="${img(d.k)}" alt=""><b class="nm"></b>`;
      e.querySelector('.nm').textContent = (d.name ? d.name + ' · ' : '') + P.t;
      root.appendChild(e);
      e.animate([{ opacity: 1 }, { opacity: 1, offset: 0.82 }, { opacity: 0 }], { duration: MS, fill: 'forwards' });
      setTimeout(() => e.remove(), MS + 100);
      const all = root.querySelectorAll('.wp'); if (all.length > 14) all[0].remove();
    }
    function onMsg(d) {
      if (!d) return;
      if (d.type === 'wheel') { const w = wheel(); ox = d.x; oy = d.y; w.style.left = d.x + 'px'; w.style.top = d.y + 'px'; w.classList.add('open'); sel('look', d.x, d.y); }
      else if (d.type === 'move' && pw) sel(d.sel, d.x, d.y);
      else if (d.type === 'end' && pw) pw.classList.remove('open');
      else if (d.type === 'show') show(d);
      else if (d.type === 'err') { const e = document.createElement('div'); e.className = 'er'; e.textContent = d.text || ''; e.style.left = d.x + 'px'; e.style.top = d.y + 'px'; root.appendChild(e); setTimeout(() => e.remove(), 1800); }
    }
    if (window.api && window.api.onCping) window.api.onCping(onMsg);
    else {   // 🎨 목업(브라우저 직접 열기)
      document.body.style.background = '#0a1712';
      onMsg({ type: 'show', k: 'missing', fx: .3, fy: .45, name: '애긔반달곰' });
      onMsg({ type: 'wheel', x: 800, y: 380 }); onMsg({ type: 'move', sel: 'missing', x: 750, y: 382 });
    }
  </script>
</body>
</html>
