<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../shared.css">
  <style>
    * { margin:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; background:transparent; overflow:hidden; -webkit-user-select:none; }
    /* 📍 롤 대기방 위 「내 자리」 마커(v0.1.54 단순화) — 앉아야 할 팀 컬럼 위에 팀 색 태그 한 줄 + 아래 화살표 하나.
       글: go=「1팀」 · move/spec=「1팀으로 이동」 · ok=「1팀 ✓」(흐리게·화살표 없음) (main updateSlotMarker → slot-team {side,state,appear})
       창 150×58(기준 크기) — 화살표는 늘 창 가운데라 main의 위치 계산(창 오른쪽 끝=팀 칸 오른쪽 끝)과 맞물림.
       ⚠️ 무한 애니메이션 금지 — 투명 창이라 움직이는 동안 창 전체를 매 프레임 다시 그림(v0.1.5). 등장·경고 효과는 짧게 몇 번만. */
    #mk { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; padding-top:4px; --tc:var(--t1);
      filter:drop-shadow(0 2px 6px rgba(0,0,0,0.6)); }
    #mk.t2 { --tc:var(--t2); }
    #mk.hide { visibility:hidden; }
    .tag { height:32px; padding:0 14px; display:flex; align-items:center; background:var(--tc); color:#06101a;
      font-family:var(--f-body); font-size:16px; font-weight:800; white-space:nowrap; letter-spacing:-0.2px;
      clip-path:polygon(7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%, 0 7px); }
    .arw { width:16px; height:10px; margin-top:4px; background:var(--tc); clip-path:polygon(0 0, 100% 0, 50% 100%); }

    #mk.ok { opacity:0.7; }
    #mk.ok .arw { visibility:hidden; }

    /* 한 번만 재생되는 효과(클래스를 붙였다 떼며 다시 재생) */
    #mk.in .tag { animation:mkIn .3s cubic-bezier(.2,.9,.3,1.2) both; }
    #mk.in .arw { animation:mkIn .3s .1s ease-out both; }
    #mk.warn .tag { animation:mkIn .3s cubic-bezier(.2,.9,.3,1.2) both, mkFlash .45s .3s ease-in-out 3; }
    #mk.warn .arw { animation:mkBob .45s .3s ease-in-out 3; }
    @keyframes mkIn { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:none; } }
    @keyframes mkFlash { 50% { filter:brightness(1.45); } }
    @keyframes mkBob { 50% { transform:translateY(4px); } }
  </style>
</head>
<body>
  <div id="mk" class="hide">
    <div class="tag" id="tx">1팀</div>
    <div class="arw"></div>
  </div>
  <script>
    const TXT = {
      go:   (s) => `${s}팀`,
      ok:   (s) => `${s}팀 ✓`,
      move: (s) => `${s}팀으로 이동`,
      spec: (s) => `${s}팀으로 이동`,
    };
    function setMarker(d) {
      if (typeof d === 'number') d = { side: d, state: 'go', appear: true };
      const mk = document.getElementById('mk');
      const side = d.side === 2 ? 2 : 1, state = TXT[d.state] ? d.state : 'go';
      document.getElementById('tx').textContent = TXT[state](side);
      mk.className = '';
      void mk.offsetWidth;   // 효과 다시 재생
      const warn = state === 'move' || state === 'spec';
      mk.className = (side === 2 ? 't2 ' : '') + state + ' ' + (warn ? 'warn' : d.appear ? 'in' : '');
    }
    if (window.api) { window.api.onSlotTeam(setMarker); }
    else {   // 🎨 목업(브라우저 직접 열기) — ?side=2&state=move
      const q = new URLSearchParams(location.search);
      const s = document.createElement('style');
      s.textContent = "html,body{background:#0a1712;} #mk{position:relative!important;width:150px;height:58px;margin:60px auto;}";
      document.head.appendChild(s);
      setMarker({ side: +(q.get('side') || 1), state: q.get('state') || 'go', appear: true });
    }
  </script>
</body>
</html>
