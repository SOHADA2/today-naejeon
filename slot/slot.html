<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../shared.css">
  <style>
    * { margin:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; background:transparent; overflow:hidden; -webkit-user-select:none; }
    /* 📍 롤 대기방 위 「내 자리」 마커(v0.1.50) — 앉아야 할 팀 컬럼 위에 팀 색 칩 + 아래 화살표.
       상태: go=여기 앉아요 · ok=잘 앉음 · move=반대 팀에 앉음 · spec=관전석 (main updateSlotMarker → slot-team {side,state,appear})
       ⚠️ 무한 애니메이션 금지 — 투명 창이라 움직이는 동안 창 전체를 매 프레임 다시 그림(v0.1.5). 등장·경고 효과는 짧게 몇 번만. */
    #mk { position:absolute; left:0; right:0; top:0; bottom:0; display:flex; flex-direction:column; align-items:stretch; padding:3px 3px 0; --tc:var(--t1); --tc-rgb:74,168,255; }
    #mk.t2 { --tc:var(--t2); --tc-rgb:255,90,110; }
    #mk.hide { visibility:hidden; }
    .chip { position:relative; display:flex; align-items:stretch; height:46px; flex:none;
      background:linear-gradient(158deg, rgba(12,24,40,0.94), rgba(3,11,20,0.97));
      border:1px solid rgba(var(--tc-rgb),0.85);
      box-shadow:0 0 0 1px rgba(0,0,0,0.5), 0 0 16px rgba(var(--tc-rgb),0.45), inset 0 0 18px rgba(var(--tc-rgb),0.12);
      clip-path:polygon(9px 0, 100% 0, 100% calc(100% - 9px), calc(100% - 9px) 100%, 0 100%, 0 9px); }
    .blk { flex:none; width:44px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
      background:linear-gradient(180deg, rgba(var(--tc-rgb),0.95), rgba(var(--tc-rgb),0.62)); color:#06101a; }
    .blk .n { font-family:var(--f-num); font-weight:700; font-size:25px; line-height:0.9; }
    .blk .en { font-family:var(--f-num); font-weight:700; font-size:9.5px; letter-spacing:0.14em; line-height:1; opacity:0.85; }
    .tx { flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; padding:0 9px 0 10px; gap:3px; }
    .l1 { font-family:var(--f-body); font-size:14px; font-weight:800; color:#F4F7FB; line-height:1.05; white-space:nowrap; letter-spacing:0.2px; text-shadow:0 1px 3px rgba(0,0,0,0.7); }
    .l2 { font-family:var(--f-body); font-size:11px; font-weight:600; color:rgba(var(--tc-rgb),1); line-height:1.05; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .arw { flex:none; align-self:center; width:26px; height:20px; margin-top:2px; position:relative; }
    .arw i { position:absolute; left:3px; width:20px; height:10px; background:var(--tc); clip-path:polygon(0 0, 50% 100%, 100% 0, 78% 0, 50% 56%, 22% 0);
      filter:drop-shadow(0 0 4px rgba(var(--tc-rgb),0.8)); }
    .arw i:nth-child(1) { top:0; opacity:0.55; }
    .arw i:nth-child(2) { top:8px; }

    /* ✓ 잘 앉음 — 조용하게(눈에 덜 띄게) */
    #mk.ok .chip { box-shadow:0 0 0 1px rgba(0,0,0,0.5), 0 0 8px rgba(var(--tc-rgb),0.25); border-color:rgba(var(--tc-rgb),0.55); }
    #mk.ok .arw { visibility:hidden; }
    #mk.ok { opacity:0.86; }
    /* ⇄ 자리가 틀림 — 금색 경고 테두리 + 짧게 3번 번쩍 */
    #mk.move .chip, #mk.spec .chip { border-color:var(--gold-hi); box-shadow:0 0 0 1px rgba(0,0,0,0.5), 0 0 18px rgba(240,215,154,0.55), inset 0 0 18px rgba(240,215,154,0.14); }
    #mk.move .l1, #mk.spec .l1 { color:var(--gold-hi); }
    #mk.move .l2, #mk.spec .l2 { color:#E9DDBF; }

    /* 한 번만 재생되는 효과(클래스를 붙였다 떼며 다시 재생) */
    #mk.in .chip { animation:mkIn .34s cubic-bezier(.2,.9,.3,1.25) both; }
    #mk.in .arw { animation:mkArw .5s .18s ease-out both; }
    #mk.warn .chip { animation:mkIn .3s cubic-bezier(.2,.9,.3,1.25) both, mkFlash .5s .3s ease-in-out 3; }
    #mk.warn .arw { animation:mkBob .45s .3s ease-in-out 3; }
    @keyframes mkIn { from { opacity:0; transform:translateY(-10px) scale(0.94); } to { opacity:1; transform:none; } }
    @keyframes mkArw { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:none; } }
    @keyframes mkFlash { 50% { filter:brightness(1.55); } }
    @keyframes mkBob { 50% { transform:translateY(5px); } }
  </style>
</head>
<body>
  <div id="mk" class="hide">
    <div class="chip">
      <div class="blk"><span class="n" id="n">1</span><span class="en">TEAM</span></div>
      <div class="tx"><div class="l1" id="l1">내 자리</div><div class="l2" id="l2">여기 1팀에 앉아요</div></div>
    </div>
    <div class="arw"><i></i><i></i></div>
  </div>
  <script>
    const TXT = {
      go:   (s) => ['내 자리', `여기 ${s}팀에 앉아요`],
      ok:   (s) => ['✓ 자리 맞아요', `${s}팀에 잘 앉았어요`],
      move: (s) => ['⇄ 이쪽으로 옮겨요', `지금 ${3 - s}팀 자리에 있어요`],
      spec: (s) => ['⇄ 이쪽으로 옮겨요', '지금 관전석에 있어요'],
    };
    function setMarker(d) {
      if (typeof d === 'number') d = { side: d, state: 'go', appear: true };
      const mk = document.getElementById('mk');
      const side = d.side === 2 ? 2 : 1, state = TXT[d.state] ? d.state : 'go';
      const [a, b] = TXT[state](side);
      document.getElementById('n').textContent = side;
      document.getElementById('l1').textContent = a;
      document.getElementById('l2').textContent = b;
      mk.className = '';
      void mk.offsetWidth;   // 효과 다시 재생
      const warn = state === 'move' || state === 'spec';
      mk.className = (side === 2 ? 't2 ' : '') + state + ' ' + (warn ? 'warn' : d.appear ? 'in' : '');
    }
    if (window.api) { window.api.onSlotTeam(setMarker); }
    else {   // 🎨 목업(브라우저 직접 열기) — ?side=2&state=move
      const q = new URLSearchParams(location.search);
      const s = document.createElement('style');
      s.textContent = "html,body{background:#0a1712;} #mk{position:relative!important;width:184px;height:74px;margin:60px auto;}";
      document.head.appendChild(s);
      setMarker({ side: +(q.get('side') || 1), state: q.get('state') || 'go', appear: true });
    }
  </script>
</body>
</html>
