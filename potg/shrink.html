<!doctype html>
<html><head><meta charset="utf-8"><title>shrink</title></head>
<body style="margin:0;background:#000">
<script>
// 🎬 팟지 영상 줄이기(v0.1.34 · 방장 PC 숨은 창) — 롤 녹화는 width/height를 무시하고 모니터 크기(예: 3440×1440)로 저장해서
// 큰 파일(10초에 8MB)이 됨 → 가로 W로 줄여 다시 녹화(소리 포함). 실제 시간만큼 걸림(20초 영상 = 약 20초).
// 메인이 executeJavaScript('shrink(src, W, kbps)')로 부르고 base64(webm)를 돌려받음.
async function shrink(src, W, kbps) {
  const v = document.createElement('video');
  v.src = src; v.preload = 'auto'; v.playsInline = true;
  await new Promise((ok, no) => { v.onloadedmetadata = ok; v.onerror = () => no(new Error('영상 열기 실패')); });
  const w = Math.min(W, v.videoWidth) & ~1, h = Math.round(w * v.videoHeight / v.videoWidth) & ~1;
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const g = cv.getContext('2d');
  const ac = new AudioContext(), dest = ac.createMediaStreamDestination();
  try { ac.createMediaElementSource(v).connect(dest); } catch (_) {}   // 스피커로는 안 내보냄(소리 안 남)
  const stream = cv.captureStream(30);
  dest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
  const mime = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
  const mr = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: (kbps || 2500) * 1000, audioBitsPerSecond: 96000 });
  const parts = [];
  mr.ondataavailable = e => { if (e.data && e.data.size) parts.push(e.data); };
  const done = new Promise(r => { mr.onstop = r; });
  const draw = () => { if (v.readyState >= 2) g.drawImage(v, 0, 0, w, h); };
  draw();
  mr.start(1000);
  const timer = setInterval(draw, 1000 / 30);   // 숨은 창은 requestAnimationFrame이 느려서 타이머로 그림
  await ac.resume().catch(() => {});
  await v.play();
  await new Promise(r => { v.onended = r; setTimeout(r, (v.duration + 10) * 1000); });
  draw(); clearInterval(timer);
  mr.stop(); await done;
  const buf = await new Blob(parts, { type: 'video/webm' }).arrayBuffer();
  let s = ''; const u = new Uint8Array(buf);
  for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
  return { b64: btoa(s), w, h, sec: v.duration };
}
</script>
</body></html>
