<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>PLAY OF THE GAME</title>
<link rel="stylesheet" href="../shared.css">
<link rel="stylesheet" href="potg.css">
</head>
<body>
  <!-- 🎬 팟지 창 — 롤 클라 가운데 · 소개 → 장면(영상 또는 킬 타임라인) → 저장/닫기 -->
  <div id="pg" class="pg">
    <header class="pg-top">
      <span class="pg-en">PLAY OF THE GAME</span>
      <button id="pg-x" class="pg-x" title="닫기">✕</button>
    </header>
    <section id="pg-intro" class="pg-intro">
      <!-- v0.1.43: 그 사람이 낀 스킨 일러스트를 배경으로 · 아래 어둡게 · 팀 색 사선 띠 위에 글자 -->
      <div class="pg-splash"><img id="pg-splash" alt=""></div>
      <div class="pg-shade"></div>
      <div class="pg-slash"></div>
      <div class="pg-ibody">
        <div class="pg-intro-en"><i></i>PLAY OF THE GAME</div>
        <div class="pg-hero">
          <span id="pg-av" class="pg-av"></span>
          <div class="pg-who"><b id="pg-name" class="pg-name"></b><span id="pg-sub" class="pg-sub"></span></div>
        </div>
        <div id="pg-label" class="pg-label"></div>
      </div>
      <div id="pg-iflash" class="pg-iflash"></div>
    </section>
    <section id="pg-stage" class="pg-stage" style="display:none;">
      <div id="pg-vwrap" class="pg-vwrap"><video id="pg-video" class="pg-video" playsinline></video></div>
      <div id="pg-fx" class="pg-fx" style="display:none;">
        <div class="pg-bar top"></div><div class="pg-bar bot"></div><div class="pg-vig"></div>
        <div id="pg-flash" class="pg-flash"></div>
        <div id="pg-feed" class="pg-feed"></div>
        <div id="pg-kb" class="pg-kb"></div>
        <div id="pg-tag" class="pg-tag"></div>
        <div id="pg-meter" class="pg-meter"></div>
        <div id="pg-hits" class="pg-hits"></div>
      </div>
      <div id="pg-wait" class="pg-wait" style="display:none;">영상 받는 중…</div>
      <div id="pg-card" class="pg-card" style="display:none;"></div>
    </section>
    <footer id="pg-end" class="pg-end" style="display:none;">
      <div id="pg-sum" class="pg-sum"></div>
      <div class="pg-btns">
        <button id="pg-save" class="ui-btn-gold" style="display:none;">내 컴퓨터에 저장</button>
        <button id="pg-save2" class="ui-btn-gold" style="display:none;">숨은 영웅 저장</button>
        <button id="pg-again" class="ui-btn-ghost">다시 보기</button>
        <button id="pg-close" class="ui-btn-ghost">닫기</button>
      </div>
      <div id="pg-msg" class="pg-msg"></div>
    </footer>
  </div>
  <script src="../desktop/settings.js"></script>
  <script src="potg.js"></script>
</body>
</html>
