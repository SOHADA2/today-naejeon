<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../shared.css">
  <style>
    * { margin:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; background:transparent; overflow:hidden; -webkit-user-select:none; }
    /* 🎯 증강 순위(v0.1.78 · 베타) — 게임 화면 위 투명 창(클릭 통과) · main showAugRank → 'augrank' {cards:[{ax, ay(배지 아래 끝 · 이 창 기준), u(화면 높이 1%), cw(카드 폭), rank, tier, scope, extra, combo}]}
       v0.1.102 다시 그림(사장님: 직관적이지 않음 · 시인성) —
         · 자리 = 카드 **위쪽 빈 곳**(아래 끝이 카드 위 테두리에 살짝 걸침) → 카드 아이콘·이름·설명을 하나도 안 가림 · 폭 = 카드 폭 정도
         · 왼쪽 = 순위(가장 크게) + 등급 칩 + 「럭스 기준」 · 함정이면 빨간 「⚠ 함정」
         · 오른쪽(조합 자료 있을 때) = 「같이 가면 좋은」 + 짝 증강 **아이콘 2개**(이름 아래) + 큰 승률 — 글 대신 그림이라 한눈에
           짝이 지금 옆 카드면 아이콘에 청록 테두리 + 「◀ 옆 카드」(방향 화살표)
         · 크기 = 화면 높이(u) 기준 → 해상도가 달라도 카드 대비 같은 크기
       ⚠️ 무한 애니메이션 금지 — 뜰 때 한 번만 */
    .bd { position:absolute; transform:translate(-50%, -100%); display:flex; align-items:stretch;
      background:rgba(6,10,16,.96); border:calc(var(--u) * .3) solid var(--rc); box-shadow:0 calc(var(--u) * .5) calc(var(--u) * 1.6) rgba(0,0,0,.75), 0 0 calc(var(--u) * 1.6) var(--rg);
      clip-path:polygon(calc(var(--u) * 1.1) 0, 100% 0, 100% calc(100% - calc(var(--u) * 1.1)), calc(100% - calc(var(--u) * 1.1)) 100%, 0 100%, 0 calc(var(--u) * 1.1));
      font-family:var(--f-body); color:#f5efe2; animation:in .22s ease-out both; --rc:#6d7682; --rg:transparent; }
    .r1 { --rc:#f2c25a; --rg:rgba(242,194,90,.4); } .r2 { --rc:#cfd8e2; --rg:rgba(207,216,226,.22); } .r3 { --rc:#d48a55; --rg:rgba(212,138,85,.22); }
    /* 왼쪽: 순위 */
    .bd:not(:has(.cb)) .rk { flex:1; }
    .rk { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:calc(var(--u) * .35); padding:calc(var(--u) * .7) calc(var(--u) * 1.3); flex:none; }
    .rk .row { display:flex; align-items:center; gap:calc(var(--u) * .7); }
    .rk .n { font-family:var(--f-num); font-weight:700; font-size:calc(var(--u) * 5.4); line-height:.85; color:var(--rc); }
    .rk .n small { font-family:var(--f-body); font-size:.42em; font-weight:900; margin-left:.06em; }
    .tr { font-family:var(--f-num); font-weight:700; font-size:calc(var(--u) * 2.5); line-height:1; padding:.14em .3em .1em; color:#fff; background:#4a525c; }
    .tr.tS { background:linear-gradient(180deg, #ff9d4d, #d9542a); } .tr.tA { background:linear-gradient(180deg, #b48cff, #7a4fd6); }
    .tr.tB { background:linear-gradient(180deg, #5fb3ff, #2f74c9); } .tr.tC, .tr.tD { background:linear-gradient(180deg, #8c96a1, #5a636d); }
    .sc { font-size:calc(var(--u) * 1.55); font-weight:800; color:#d9dee4; white-space:nowrap; }
    .sc b { color:var(--rc); font-weight:900; }
    .warn { font-size:calc(var(--u) * 1.5); font-weight:900; color:#fff; background:#d8343f; padding:0 .4em; white-space:nowrap; }
    .rec { font-size:calc(var(--u) * 1.3); font-weight:700; color:#aeb6bf; white-space:nowrap; }
    .r0 .n { color:#9aa3ad; }
    /* 오른쪽: 같이 가면 좋은 증강 */
    .cb { display:flex; flex-direction:column; gap:calc(var(--u) * .45); padding:calc(var(--u) * .6) calc(var(--u) * 1.1) calc(var(--u) * .7); min-width:0; flex:1;
      border-left:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.035); }
    .cb .hd { display:flex; align-items:baseline; justify-content:space-between; gap:calc(var(--u) * .8); white-space:nowrap; }
    .cb .hd span { font-size:calc(var(--u) * 1.35); font-weight:800; color:#c9d1da; }
    .cb .hd b { font-family:var(--f-num); font-size:calc(var(--u) * 2.5); font-weight:700; line-height:1; color:#7fe0c9; }
    .cb .hd b small { font-family:var(--f-body); font-size:.5em; font-weight:800; color:#9fb3ae; margin-right:.2em; }
    .cb .ics { display:flex; justify-content:space-around; gap:calc(var(--u) * .6); }
    .pa { display:flex; flex-direction:column; align-items:center; gap:calc(var(--u) * .25); width:calc(var(--u) * 7.2); min-width:0; }
    .pa .ic { position:relative; width:calc(var(--u) * 3.9); height:calc(var(--u) * 3.9); border-radius:50%; background:#1c2632 center/cover; border:calc(var(--u) * .22) solid #8a96a3; }
    .pa .ic.gold { border-color:#e2b65a; } .pa .ic.prismatic { border-color:#c98bff; } .pa .ic.silver { border-color:#c9d1da; }
    .pa .ic i { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-style:normal; font-weight:900; font-size:calc(var(--u) * 1.8); color:#c9d1da; }
    .pa .nm { max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:calc(var(--u) * 1.3); font-weight:800; color:#f5efe2; }
    .pa.here .ic { border-color:#5fd3b8; box-shadow:0 0 0 calc(var(--u) * .2) rgba(95,211,184,.35); }
    .pa.here .nm { color:#7fe0c9; }
    .pa .tg { font-size:calc(var(--u) * 1.15); font-weight:900; color:#0b1a14; background:#5fd3b8; padding:0 .35em; white-space:nowrap; }
    @keyframes in { from { opacity:0; transform:translate(-50%, -80%); } to { opacity:1; transform:translate(-50%, -100%); } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const tcls = t => { const m = /^T([1-5])$/.exec(t || ''); return m ? ' SABCC'[m[1]] : String(t || '')[0]; };   // aramgg T1~T5 → S·A·B·C 색
    const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    function pair(a) {
      const tg = a.here ? `<span class="tg">${a.dir < 0 ? '◀ 옆 카드' : a.dir > 0 ? '옆 카드 ▶' : '옆 카드'}</span>` : '';
      return `<span class="pa${a.here ? ' here' : ''}"><span class="ic ${esc(a.rarity)}"${a.icon ? ` style="background-image:url('${esc(a.icon)}')"` : ''}>${a.icon ? '' : `<i>${esc(String(a.name || '?')[0])}</i>`}</span><span class="nm">${esc(a.name || '?')}</span>${tg}</span>`;
    }
    function set(d) {
      const cards = (d && d.cards) || [];
      document.getElementById('root').innerHTML = cards.map(c => {
        const r = c.rank ? Math.min(3, c.rank) : 0, ex = c.extra || [];
        const trap = ex.includes('함정'), rec = ex.find(x => /^우리 /.test(x));
        const left = `<span class="rk"><span class="row"><span class="n">${c.rank ? `${c.rank}<small>위</small>` : '?'}</span>${c.tier ? `<span class="tr t${esc(tcls(c.tier))}">${esc(c.tier)}</span>` : ''}</span>`
          + `<span class="sc">${c.tier ? `<b>${esc(c.scope)}</b> 기준` : c.rank ? '' : '등급 자료 없음'}</span>`
          + (trap ? '<span class="warn">⚠ 함정</span>' : '') + (rec ? `<span class="rec">${esc(rec)}</span>` : '') + '</span>';
        const cb = c.combo && c.combo.with && c.combo.with.length ? `<span class="cb"><span class="hd"><span>🔗 같이 가면 좋은</span><b><small>승률</small>${Math.round((c.combo.wr || 0) * 100)}%</b></span><span class="ics">${c.combo.with.map(pair).join('')}</span></span>` : '';
        const u = c.u || 10;
        return `<div class="bd r${r}" style="--u:${u}px;left:${Math.round(c.ax)}px;top:${Math.round(c.ay)}px;width:${Math.round((c.cw || u * 29.6) + u * 1.2)}px" title="${esc(c.combo ? c.combo.n + '판' : '')}">${left}${cb}</div>`;
      }).join('');
    }
    window.__set = set;
    if (window.api && window.api.onAugRank) window.api.onAugRank(set);
  </script>
</body>
</html>
