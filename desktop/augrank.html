<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../shared.css">
  <style>
    * { margin:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; background:transparent; overflow:hidden; -webkit-user-select:none; }
    /* 🎯 증강 순위(v0.1.78 · 베타) — 게임 화면 위 투명 창(클릭 통과) · main showAugRank → 'augrank' {cards:[{ax, ay(카드 위쪽 가운데 · 이 창 기준), rank, tier, scope, extra, why}]}
       v0.1.86: 사장님 「글자가 잘 안 보임 · 더 직관적이고 시인성 있게」 → 아이콘·이름 사이에 끼우던 것 대신 **카드 맨 위 가장자리 가운데에 리본처럼**
         진한 불투명 판 + 순위 색 테두리 · 1줄 = 「1위」(가장 크게) + 등급 칩 · 2줄 = 「신 짜오 기준」 · 크기 = 창 높이(화면 높이 42%) 비례(vh)
       ⚠️ 무한 애니메이션 금지 — 뜰 때 한 번만 */
    .bd { position:absolute; transform:translate(-50%, -50%); display:flex; flex-direction:column; align-items:center; gap:.35vh;
      padding:.9vh 2.2vh 1vh; background:rgba(7,11,17,.95); border:.45vh solid var(--rc); box-shadow:0 .6vh 1.8vh rgba(0,0,0,.7), 0 0 2.2vh var(--rg);
      clip-path:polygon(1.4vh 0, 100% 0, 100% calc(100% - 1.4vh), calc(100% - 1.4vh) 100%, 0 100%, 0 1.4vh); animation:in .22s ease-out both; --rc:#7d8792; --rg:transparent; }
    .r1 { --rc:#f2c25a; --rg:rgba(242,194,90,.45); } .r2 { --rc:#cfd8e2; --rg:rgba(207,216,226,.3); } .r3 { --rc:#d48a55; --rg:rgba(212,138,85,.3); }
    .top { display:flex; align-items:center; gap:1.2vh; }
    .rk { font-family:var(--f-num); font-weight:700; font-size:max(30px, 7.6vh); line-height:.9; color:var(--rc); text-shadow:0 .3vh .6vh rgba(0,0,0,.8); }
    .rk small { font-family:var(--f-body); font-size:.48em; font-weight:800; margin-left:.08em; }
    .tr { font-family:var(--f-num); font-weight:700; font-size:max(20px, 5vh); line-height:1; padding:.12em .32em .08em; color:#fff; background:#4a525c; text-shadow:0 .15vh .3vh rgba(0,0,0,.5); }
    .tr.tS { background:linear-gradient(180deg, #ff9d4d, #d9542a); } .tr.tA { background:linear-gradient(180deg, #b48cff, #7a4fd6); }
    .tr.tB { background:linear-gradient(180deg, #5fb3ff, #2f74c9); } .tr.tC, .tr.tD { background:linear-gradient(180deg, #8c96a1, #5a636d); }
    .sc { font-family:var(--f-body); font-size:max(14px, 3.3vh); font-weight:800; color:#f5efe2; white-space:nowrap; letter-spacing:-.01em; }
    .sc b { color:var(--rc); font-weight:900; }
    .sc em { font-style:normal; color:#c9d1da; font-weight:700; }
    /* 🔗 v0.1.101 조합 줄 — 이 카드와 승률 좋은 3개 조합의 나머지 둘(aramgg) · 같은 화면에 뜬 카드면 「옆」 */
    .cb { display:flex; align-items:center; gap:.5vh; max-width:min(46vw, 62vh); font-family:var(--f-body); font-size:max(13px, 2.7vh); font-weight:700; color:#cfe6f2;
      padding-top:.45vh; margin-top:.15vh; border-top:1px solid rgba(255,255,255,.14); white-space:nowrap; }
    .cb .nm { overflow:hidden; text-overflow:ellipsis; min-width:0; max-width:11em; color:#fff; }
    .cb .pl { color:#7f8b97; flex:none; }
    .cb .hr { flex:none; font-size:.78em; font-weight:800; color:#0b1a14; background:#5fd3b8; padding:0 .3em; margin-left:.3vh; }
    .cb .wr { flex:none; font-family:var(--f-num); color:var(--rc); margin-left:.4vh; }
    .r0 .cb .wr { color:#cfe6f2; }
    .r0 .rk { color:#aeb6bf; } .r0 .sc { color:#c9d1da; }
    @keyframes in { from { opacity:0; transform:translate(-50%, -30%); } to { opacity:1; transform:translate(-50%, -50%); } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const tcls = t => { const m = /^T([1-5])$/.exec(t || ''); return m ? ' SABCC'[m[1]] : String(t || '')[0]; };   // aramgg T1~T5(v0.1.100) → 예전 S·A·B·C 색
    const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    function comboHtml(cb) {
      if (!cb || !cb.with || !cb.with.length) return '';
      const parts = cb.with.map(a => `<span class="nm">${esc(a.name || '?')}</span>${a.here ? '<span class="hr">옆</span>' : ''}`).join('<span class="pl">+</span>');
      return `<span class="cb" title="${esc(cb.n)}판"><span class="pl">🔗 조합</span>${parts}<span class="wr">${Math.round((cb.wr || 0) * 100)}%</span></span>`;
    }
    function set(d) {
      const cards = (d && d.cards) || [];
      document.getElementById('root').innerHTML = cards.map(c => {
        const r = c.rank ? Math.min(3, c.rank) : 0;
        const scope = c.tier ? `<b>${esc(c.scope)}</b> 기준` : c.rank ? '' : '등급 자료 없음';
        const extra = (c.extra || []).map(x => `<em>${esc(x)}</em>`).join(' · ');
        return `<div class="bd r${r}" style="left:${Math.round(c.ax)}px;top:${Math.round(c.ay)}px">
          <span class="top"><span class="rk">${c.rank ? `${c.rank}<small>위</small>` : '?'}</span>${c.tier ? `<span class="tr t${esc(tcls(c.tier))}">${esc(c.tier)}</span>` : ''}</span>
          <span class="sc">${[scope, extra].filter(Boolean).join(' · ') || esc(c.why || '')}</span>${comboHtml(c.combo)}</div>`;
      }).join('');
    }
    window.__set = set;
    if (window.api && window.api.onAugRank) window.api.onAugRank(set);
  </script>
</body>
</html>
