<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../shared.css">
  <style>
    * { margin:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; background:transparent; overflow:hidden; -webkit-user-select:none; }
    /* 🎯 증강 순위(v0.1.78 · 베타) — 게임 화면 위 투명 창(클릭 통과) · main showAugRank → 'augrank' {cards:[{ax, ay(배지 아래 끝 · 이 창 기준), u(화면 높이 1%), cw(카드 폭), rank, tier, scope, extra, combo}]}
       v0.1.102 다시 그림(사장님: 직관적이지 않음 · 시인성) —
         · 자리 = 카드 **위쪽 빈 곳**(아래 끝이 카드 위 테두리에 살짝 걸침) → 카드 아이콘·이름·설명을 하나도 안 가림 · 폭 = 카드 폭 정도
         · 왼쪽 = 순위(가장 크게) + 등급 칩 + 「럭스 기준」
         · 오른쪽(조합 자료 있을 때) = 「같이 가면 좋은」 + 짝 증강 **아이콘 2개**(이름 아래) + 큰 승률 — 글 대신 그림이라 한눈에
           v0.1.103: 「옆 카드」 표시 뺌(사장님: 직관적이지 않음) → 자세한 설명은 전부 **마우스 올림**(순위·등급·승률·고른 비율 · 조합 판 수·패치 · 우리 기록) · v0.1.104 같이 뜬 카드가 짝인 조합은 안 보여줌(셋 중 하나만 고르니)
         · 크기 = 화면 높이(u) 기준 → 해상도가 달라도 카드 대비 같은 크기
       ⚠️ 무한 애니메이션 금지 — 뜰 때 한 번만 */
    .bd { position:absolute; transform:translate(-50%, -100%); display:flex; align-items:stretch; height:calc(var(--u) * 10.2);
      background:rgba(6,10,16,.96); border:calc(var(--u) * .3) solid var(--rc); box-shadow:0 calc(var(--u) * .5) calc(var(--u) * 1.6) rgba(0,0,0,.75), 0 0 calc(var(--u) * 1.6) var(--rg);
      clip-path:polygon(calc(var(--u) * 1.1) 0, 100% 0, 100% calc(100% - calc(var(--u) * 1.1)), calc(100% - calc(var(--u) * 1.1)) 100%, 0 100%, 0 calc(var(--u) * 1.1));
      font-family:var(--f-body); color:#f5efe2; animation:in .22s ease-out both; --rc:#6d7682; --rg:transparent; }
    .r1 { --rc:#f2c25a; --rg:rgba(242,194,90,.4); } .r2 { --rc:#cfd8e2; --rg:rgba(207,216,226,.22); } .r3 { --rc:#d48a55; --rg:rgba(212,138,85,.22); }
    /* 왼쪽: 순위 */
        .rk { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:calc(var(--u) * .45); padding:0 calc(var(--u) * 1.1); flex:none; width:calc(var(--u) * 11.5); min-width:0; }
    .rk .row { display:flex; align-items:center; gap:calc(var(--u) * .7); white-space:nowrap; }
    .rk .n { flex:none; white-space:nowrap; } .rk .n { font-family:var(--f-num); font-weight:700; font-size:calc(var(--u) * 6.2); line-height:.85; color:var(--rc); }
    .rk .n small { font-family:var(--f-body); font-size:.42em; font-weight:900; margin-left:.06em; }
    .sc { font-size:calc(var(--u) * 1.55); font-weight:800; color:#d9dee4; white-space:nowrap; }
    .sc b { color:var(--rc); font-weight:900; }
    .rec { font-size:calc(var(--u) * 1.3); font-weight:700; color:#aeb6bf; white-space:nowrap; }
    .r0 .n { color:#9aa3ad; }
    /* 오른쪽: 같이 가면 좋은 증강 */
    .cb { display:flex; flex-direction:column; gap:calc(var(--u) * .45); padding:calc(var(--u) * .6) calc(var(--u) * 1.1) calc(var(--u) * .7); min-width:0; flex:1;
      border-left:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.035); }
    .cb .hd { display:flex; align-items:baseline; justify-content:space-between; gap:calc(var(--u) * .8); white-space:nowrap; }
    .cb .hd span { font-size:calc(var(--u) * 1.35); font-weight:800; color:#c9d1da; }
    .cb .ics { display:flex; justify-content:space-around; align-items:flex-start; gap:calc(var(--u) * .6); height:calc(var(--u) * 5.8); }
    .cb .ics.none { align-items:center; justify-content:center; font-size:calc(var(--u) * 1.35); font-weight:700; color:#6f7a86; }
    .sc { max-width:100%; overflow:hidden; text-overflow:ellipsis; }
    .pa { display:flex; flex-direction:column; align-items:center; gap:calc(var(--u) * .25); width:calc(var(--u) * 7.2); min-width:0; }
    .pa .ic { position:relative; width:calc(var(--u) * 3.9); height:calc(var(--u) * 3.9); border-radius:50%; background:#1c2632 center/cover; border:calc(var(--u) * .22) solid #8a96a3; }
    .pa .ic.it { border-radius:14%; border-color:#c8aa6e; }   /* 🗡️ 운명의 무기 첫 템(아이템 아이콘 = 네모) */
    .pa .ic.gold { border-color:#e2b65a; } .pa .ic.prismatic { border-color:#c98bff; } .pa .ic.silver { border-color:#c9d1da; }
    .pa .ic i { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-style:normal; font-weight:900; font-size:calc(var(--u) * 1.8); color:#c9d1da; }
    .pa .nm { max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:calc(var(--u) * 1.3); font-weight:800; color:#f5efe2; }
    /* 💬 마우스 올림 설명(v0.1.103) — 창은 클릭 통과 + 움직임만 받음(main forward) · 설명 붙은 곳은 올리면 살짝 밝아짐 */
    [data-tip] { cursor:help; }
    [data-tip]:hover { background:rgba(255,255,255,.08); }
    #tip { position:fixed; z-index:9; max-width:min(44vw, calc(var(--tu, 10px) * 34)); padding:calc(var(--tu, 10px) * .7) calc(var(--tu, 10px) * 1); display:none;
      background:#0b121b; border:1px solid rgba(242,194,90,.55); box-shadow:0 calc(var(--tu, 10px) * .4) calc(var(--tu, 10px) * 1.4) rgba(0,0,0,.8);
      font-family:var(--f-body); font-size:max(12px, calc(var(--tu, 10px) * 1.45)); line-height:1.45; font-weight:600; color:#e8edf2; pointer-events:none; }
    #tip b { color:#f2c25a; font-weight:900; }
    #tip.on { display:block; }
    @keyframes in { from { opacity:0; transform:translate(-50%, -80%); } to { opacity:1; transform:translate(-50%, -100%); } }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="tip"></div>
  <script>
    const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const pct = x => x == null ? '' : Math.round(x * 1000) / 10 + '%';
    const TIPS = [];   // data-tip 번호 → 설명 HTML(그릴 때마다 새로)
    const tip = h => { TIPS.push(h); return ` data-tip="${TIPS.length - 1}"`; };
    function pair(a, c) {
      return `<span class="pa"${tip(`<b>${esc(a.name || '?')}</b>`)}><span class="ic ${esc(a.rarity)}"${a.icon ? ` style="background-image:url('${esc(a.icon)}')"` : ''}>${a.icon ? '' : `<i>${esc(String(a.name || '?')[0])}</i>`}</span><span class="nm">${esc(a.name || '?')}</span></span>`;
    }
    function set(d) {
      const cards = (d && d.cards) || [];
      TIPS.length = 0;
      document.getElementById('root').innerHTML = cards.map(c => {
        const r = c.rank ? Math.min(3, c.rank) : 0, ex = c.extra || [];
        const rec = ex.find(x => /^우리 /.test(x));
        // 🎯 v0.1.106 등급 하나로(사장님: 1·2·3위·T1~T5·조합 승률·추천 S가 섞여 헷갈림 → 「셋 중 뭘 고르면 좋은지」 하나) — 화면 = 순위만(금·은·동)
        //   T 등급·승률·조합 승률은 마우스 올림 설명에 정보로만(누가 추천했는지 같은 말 없이)
        const rkTip = (c.tier ? `<b>${esc(c.scope === '전체' ? '모든 챔피언' : c.scope)}</b> 기준` : '등급 자료 없음')
          + (c.wr != null ? ` · 승률 ${pct(c.wr)}` : '') + (c.pr != null ? ` · 고른 비율 ${pct(c.pr)}` : '') + (rec ? `<br>${esc(rec)}` : '');
        const scLine = `<span class="sc">${c.tier ? `<b>${esc(c.scope)}</b> 기준` : '순위 자료 없음'}</span>`;
        const left = `<span class="rk"${tip(rkTip)}><span class="n">${c.rank ? `${c.rank}<small>위</small>` : '–'}</span>${scLine}</span>`;
        const cm = c.combo && c.combo.with && c.combo.with.length ? c.combo : null, gg = cm && cm.src === 'aramgg';
        const cbTip = !cm ? '조합 자료 없음'
          : gg ? `세 증강을 함께 고른 판 승률 ${pct(cm.wr)} · ${esc(cm.n)}판<br>aramgg${cm.p ? ' · 패치 ' + esc(cm.p) : ''}`
          : `함께 노릴 증강: ${(cm.all || cm.with.map(a => a.name)).map(esc).join(', ')}<br>${cm.src === 'arammayhem' ? 'arammayhem' : '증강 가이드'}${cm.date ? ' · ' + esc(cm.date.slice(0, 7)) : ''}`;
        let cb = `<span class="cb${cm ? '' : ' none'}"${tip(cbTip)}><span class="hd"><span>🔗 같이 가면 좋은</span></span>`
          + (cm ? `<span class="ics">${cm.with.slice(0, 2).map(a => pair(a, c)).join('')}</span>` : '<span class="ics none">조합 자료 없음</span>') + '</span>';
        const D = c.destiny;   // 🗡️ v0.1.141 운명의 무기 카드 = 조합 칸 대신 첫 템 추천(챔피언 유형별 · 유저 가이드 기준)
        if (D) cb = `<span class="cb"${tip(`<b>운명의 무기 첫 템</b> · ${esc(D.label)}<br>${esc(D.line)}${D.src ? '<br>' + esc(D.src) : ''}<br>첫 전설 템에 붙어 처치 관여마다 커지고, 팔 수 없어요`)}><span class="hd"><span>🗡 첫 템 추천</span></span>`
          + ((D.items || []).length ? `<span class="ics">${D.items.slice(0, 2).map(i => `<span class="pa"><span class="ic it"${i.icon ? ` style="background-image:url('${esc(i.icon)}')"` : ''}></span><span class="nm">${esc(i.name)}</span></span>`).join('')}</span>` : `<span class="ics none">${esc(D.label)} · 원래 첫 템</span>`) + '</span>';
        const u = c.u || 10;
        document.documentElement.style.setProperty('--tu', u + 'px');
        return `<div class="bd r${r}" style="--u:${u}px;left:${Math.round(c.ax)}px;top:${Math.round(c.ay)}px;width:${Math.round((c.cw || u * 29.6) + u * 1.2)}px">${left}${cb}</div>`;
      }).join('');
      hideTip();
    }
    // 💬 설명 띄우기 — 올린 칸 바로 아래(창 밖으로 안 나가게)
    const tipEl = document.getElementById('tip');
    function hideTip() { tipEl.className = ''; }
    document.addEventListener('mousemove', e => {
      const t = e.target.closest && e.target.closest('[data-tip]');
      if (!t) return hideTip();
      tipEl.innerHTML = TIPS[+t.dataset.tip] || ''; tipEl.className = 'on';
      const r = t.getBoundingClientRect(), bd = (t.closest('.bd') || t).getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight;   // 배지 전체 아래에(배지 글자를 안 가리게)
      const x = Math.max(4, Math.min(innerWidth - w - 4, r.left + r.width / 2 - w / 2));
      const y = bd.bottom + 6 + h > innerHeight ? Math.max(4, bd.top - h - 6) : bd.bottom + 6;
      tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px';
    });
    document.addEventListener('mouseleave', hideTip);
    window.__set = set;
    if (window.api && window.api.onAugRank) window.api.onAugRank(set);
  </script>
</body>
</html>
