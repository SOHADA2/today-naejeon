<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>투데이 내전</title>
  <link rel="stylesheet" href="../shared.css">
  <style>
    /* ✨ v0.1.277 접힌 창 손잡이(사장님: 세로 글자 말고 빛이 새어 나오는 느낌 · 누르면 예전처럼 열림)
       v0.1.278(사장님: 마우스를 올렸을 때 창 조각이 나오는 게 아니라 화살표만 · 이모지 같은 화살표 말고 모양으로 방향을 나타내게)
       창 = 클라 가장자리에 붙은 투명 창(main FOLD_HW 폭 · 클라 높이) · 기준 = 왼쪽 손잡이(클라가 오른쪽) · 오른쪽 손잡이는 통째로 좌우 뒤집음(scaleX(-1))
       쉬는 모습 = 클라와 창 사이 틈의 금빛 선 + 바깥으로 번지는 빛
       마우스를 올리면 = 빛이 조금 더 밝아지고, 틈에서 빛으로 그린 길쭉한 겹 꺾쇠(.chev — 가운데가 밝고 끝이 옅어지는 선)가 스며 나옴 · 누르면 펼침(손잡이 어디를 눌러도)
       ⚠️ 무한 애니메이션 금지(투명 창) — 나타날 때 한 번·마우스 올림 전환만 */
    html, body { margin:0; width:100%; height:100%; background:transparent; overflow:hidden; -webkit-user-select:none; user-select:none; }
    #hit { position:fixed; inset:0; background:rgba(0,0,0,0.01); cursor:pointer; }   /* 거의 투명한 바탕 = 마우스 올림을 받음 */
    body.R #hit { transform:scaleX(-1); }
    .seam, .leak, .rays { position:absolute; top:0; bottom:0; right:0; pointer-events:none; }
    /* 틈의 빛줄기 — 가운데가 가장 밝고 위아래로 옅어짐 */
    .seam { width:2px; background:linear-gradient(180deg, transparent 0%, rgba(240,215,154,0.45) 16%, #F7E3B0 50%, rgba(240,215,154,0.45) 84%, transparent 100%);
      box-shadow:0 0 8px 1px rgba(240,215,154,0.5); transition:box-shadow .3s; }
    /* 바깥으로 새어 나오는 빛 */
    .leak { top:3%; bottom:3%; width:58px; transform-origin:100% 50%;
      background:radial-gradient(56px 54% at 100% 50%, rgba(240,215,154,0.38), rgba(200,170,110,0.13) 45%, transparent 80%);
      transition:transform .4s cubic-bezier(.2,.9,.3,1), opacity .3s; opacity:0.85; }
    .rays { top:12%; bottom:12%; width:40px; opacity:0.55;
      background:repeating-linear-gradient(180deg, rgba(247,227,176,0.10) 0 1px, transparent 1px 11px);
      -webkit-mask-image:linear-gradient(to left, #000, transparent); mask-image:linear-gradient(to left, #000, transparent);
      transition:opacity .3s; }
    /* 빛으로 그린 겹 꺾쇠 — 틈 쪽에서 스며 나옴 */
    .chev { position:absolute; right:4px; top:50%; width:24px; height:104px; margin-top:-52px; pointer-events:none;
      opacity:0; transform:translateX(9px); filter:drop-shadow(0 0 3px rgba(247,227,176,0.85)) drop-shadow(0 0 9px rgba(240,215,154,0.45));
      transition:opacity .22s, transform .38s cubic-bezier(.2,.9,.3,1); }
    .chev svg { width:100%; height:100%; display:block; overflow:visible; }
    #hit:hover .seam { box-shadow:0 0 12px 2px rgba(247,227,176,0.7); }
    #hit:hover .leak { opacity:1; transform:scaleX(1.18); }
    #hit:hover .rays { opacity:0.85; }
    #hit:hover .chev { opacity:1; transform:translateX(-10px); }
    #hit:active .chev { transform:translateX(-13px); transition-duration:.08s; }
    /* 나타날 때 한 번 = 빛줄기가 가운데에서 위아래로 퍼지고 번짐이 차오름 */
    body.in .seam { animation:ftSeam .5s cubic-bezier(.2,.9,.3,1) both; }
    body.in .leak { animation:ftLeak .7s ease-out both, ftGlow 3.6s .35s ease-in-out both; }
    body.in .rays { animation:ftLeak .7s ease-out both; }
    @keyframes ftSeam { from { transform:scaleY(0); opacity:0; } to { transform:none; opacity:1; } }
    @keyframes ftLeak { from { opacity:0; } }
    /* v0.1.280(사장님: 접을 때 화살표가 잠깐 나왔다 사라지는 게 너무 짧음 → 다시 열 수 있다는 느낌이 나게)
       손잡이가 나타날 때 한 번 = 빛 꺾쇠가 스며 나와 바깥으로 두 번 톡톡(당겨 보라는 느낌) → 잠깐 머문 뒤 천천히 사라짐(약 3.5초 · 반복 없음)
       그동안 마우스를 올리면 끝난 뒤에도 그대로 보임(마우스 올림 모양으로 이어짐) */
    body.in .chev { animation:ftHint 3.6s .35s both; }
    @keyframes ftHint {
      0%   { opacity:0; transform:translateX(9px); animation-timing-function:cubic-bezier(.2,.9,.3,1); }
      12%  { opacity:1; transform:translateX(-10px); animation-timing-function:ease-in-out; }
      22%  { transform:translateX(-4px); animation-timing-function:cubic-bezier(.3,0,.2,1.4); }
      32%  { transform:translateX(-13px); animation-timing-function:ease-in-out; }
      42%  { transform:translateX(-5px); animation-timing-function:cubic-bezier(.3,0,.2,1.4); }
      52%  { transform:translateX(-13px); animation-timing-function:ease-in-out; }
      62%  { opacity:1; transform:translateX(-10px); animation-timing-function:ease-in; }
      100% { opacity:0; transform:translateX(-6px); }
    }
    body.in #hit:hover .chev, body.in #hit:hover .leak { animation:none; }   /* 마우스가 올라가 있으면 = 그냥 마우스 올림 모양 */
    @keyframes ftGlow { 0%, 100% { opacity:.85; transform:none; } 32%, 52% { opacity:1; transform:scaleX(1.15); } 42% { opacity:.92; transform:scaleX(1.04); } }
  </style>
</head>
<body>
  <div id="hit">
    <div class="leak"></div><div class="rays"></div><div class="seam"></div>
    <div class="chev"><svg viewBox="0 0 24 104" aria-hidden="true">
      <defs>
        <linearGradient id="g1" gradientUnits="userSpaceOnUse" x1="0" y1="2" x2="0" y2="102"><stop offset="0" stop-color="#F0D79A" stop-opacity="0"/><stop offset="0.5" stop-color="#FFF4D6"/><stop offset="1" stop-color="#F0D79A" stop-opacity="0"/></linearGradient>
        <linearGradient id="g2" gradientUnits="userSpaceOnUse" x1="0" y1="18" x2="0" y2="86"><stop offset="0" stop-color="#C8AA6E" stop-opacity="0"/><stop offset="0.5" stop-color="#F0D79A"/><stop offset="1" stop-color="#C8AA6E" stop-opacity="0"/></linearGradient>
      </defs>
      <path d="M21 2 L5 52 L21 102" fill="none" stroke="url(#g1)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M22 18 L13 52 L22 86" fill="none" stroke="url(#g2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/>
    </svg></div>
  </div>
  <script>
    const side = new URLSearchParams(location.search).get('side') === 'R' ? 'R' : 'L';
    document.body.classList.add(side);
    const hit = document.getElementById('hit');
    hit.addEventListener('click', () => { if (window.api && window.api.winFold) window.api.winFold(side, false); });
    const replay = () => { document.body.classList.remove('in'); void document.body.offsetWidth; document.body.classList.add('in'); };
    if (window.api && window.api.onFoldTabIn) window.api.onFoldTabIn(replay);
    replay();
  </script>
</body>
</html>
