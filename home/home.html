<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: tnimg: https:; media-src 'self' data: blob: tnimg: https:; font-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'">
  <title>투데이 내전</title>
  <link rel="stylesheet" href="../shared.css">
  <link rel="stylesheet" href="home.css">
</head>
<body>
  <!-- 🏠 홈 화면(v0.1.127) — 롤 클라 없이 투데이 내전만 켰을 때 한 창 · 게임 시작 때는 로고만(body.logo) -->
  <header id="hbar">
    <span class="h-ver" id="h-ver"></span>
    <button class="h-btn tn-wb" id="h-min" title="최소화"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M1.5 6h9" stroke="currentColor" stroke-width="1.4"/></svg></button>
    <button class="h-btn tn-wb x" id="h-close" title="닫기"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.4"/></svg></button>
  </header>

  <i class="seam" aria-hidden="true"></i>
  <!-- 🎬 v0.1.177 게임 시작 화면(logo 모드만 · 사장님: 도형 로고 대신 글자가 주인공) — 내전 = 포스터(body.lgp: 뒤 큰 윤곽 글자 TODAY + 한글 제목) · 일반 판 = 제목 카드(body.lgc: 위아래 금색 선·마름모 사이 제목) · 둘 다 오늘 날짜 -->
  <section id="lg" aria-hidden="true">
    <i class="lg-bg"></i>
    <div class="lg-big" id="lg-big">TODAY</div>
    <i class="lg-ln t"></i><i class="lg-ln b"></i>
    <div class="lg-col">
      <span class="lg-en" id="lg-en">TODAY IN-HOUSE</span>
      <!-- v0.1.178 제목 = 리틱체(REATIC Narrow Bold)로 그린 그림(글꼴 파일은 재배포 금지라 그림만 · tools/title-img.cjs) -->
      <div class="lg-ko" id="lg-ko"><img class="lg-ti ink" src="../assets/title/title-ink.png" alt="투데이 내전"><img class="lg-ti two" src="../assets/title/title-two.png" alt="투데이 내전"></div>
      <span class="lg-date" id="lg-date"></span>
      <div class="lg-go" id="lg-go"><i></i><span id="lg-gotx">GAME START</span><i></i></div>
    </div>
  </section>
  <section id="hero">
    <div class="hero-bg" aria-hidden="true"><span>TODAY IN-HOUSE</span></div>   <!-- v0.1.184 아이콘 대신 제목 뒤 큰 영문 윤곽(사장님: 아이콘 + 제목 = 중복) -->
    <img class="mk" src="../assets/icon-src/256.png" alt="">
    <div class="tt">
      <span class="tt-en">TODAY IN-HOUSE</span>
      <h1><img class="tt-img" src="../assets/title/title-ink.png" alt="투데이 내전"></h1>   <!-- v0.1.179 리틱체 그림(tools/title-img.cjs) -->
    </div>
    <div class="go" id="go">GAME START</div>
  </section>

  <div id="notice" class="notice" hidden><span class="nt-en">NOTICE</span><span id="nt-tx" class="nt-tx"></span><button id="nt-x" class="nt-x" title="닫기(이 공지는 다시 안 떠요)">✕</button></div>   <!-- 📢 v0.1.245 운영 공지 -->
  <main id="body">
    <div class="me" id="me"></div>
    <div class="cols">
      <section class="col" id="c-rooms">
        <div class="col-hd"><span class="col-en">ROOMS<span id="rooms-comm" class="rooms-comm"></span></span><b>방 목록</b><em id="rooms-n"></em><button id="comm-chg" class="comm-chg" hidden title="초대 코드로 다른 커뮤니티의 방·기록 보기 · 바꾸면 앱이 다시 켜집니다">커뮤니티 바꾸기</button></div>
        <div class="comm-box" id="comm-box" hidden></div>   <!-- 🏘️ v0.1.265 홈 화면에서도 커뮤니티 고르기 -->
        <div class="list" id="rooms"></div>
      </section>
      <section class="col" id="c-online">
        <div class="col-hd"><span class="col-en">ONLINE</span><b>접속 중</b><em id="online-n"></em></div>
        <div class="list" id="online"></div>
      </section>
    </div>
    <footer id="foot"></footer>
  </main>
  <script src="../desktop/tip.js"></script>
  <script src="home.js"></script>
</body>
</html>
