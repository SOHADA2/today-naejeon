<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>투데이 내전</title>
  <link rel="stylesheet" href="../shared.css">
  <link rel="stylesheet" href="home.css">
</head>
<body>
  <!-- 🏠 홈 화면(v0.1.127) — 롤 클라 없이 투데이 내전만 켰을 때 한 창 · 게임 시작 때는 로고만(body.logo) -->
  <header id="hbar">
    <span class="h-ver" id="h-ver"></span>
    <button class="h-btn tn-wb" id="h-min" title="최소화"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M1.5 6h9" stroke="currentColor" stroke-width="1.4"/></svg></button>
    <button class="h-btn tn-wb x" id="h-close" title="닫기"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.4"/></svg></button>
  </header>

  <i class="seam" aria-hidden="true"></i>
  <!-- 🎬 v0.1.177 게임 시작 화면(logo 모드만 · 사장님: 도형 로고 대신 글자가 주인공) — 내전 = 포스터(body.lgp: 뒤 큰 윤곽 글자 TODAY + 한글 제목) · 일반 판 = 제목 카드(body.lgc: 위아래 금색 선·마름모 사이 제목) · 둘 다 오늘 날짜 -->
  <section id="lg" aria-hidden="true">
    <i class="lg-bg"></i>
    <div class="lg-big" id="lg-big">TODAY</div>
    <i class="lg-ln t"></i><i class="lg-ln b"></i>
    <div class="lg-col">
      <span class="lg-en" id="lg-en">TODAY NAEJEON</span>
      <!-- v0.1.178 제목 = 리틱체(REATIC Narrow Bold)로 그린 그림(글꼴 파일은 재배포 금지라 그림만 · tools/title-img.cjs) -->
      <div class="lg-ko" id="lg-ko"><img class="lg-ti ink" src="../assets/title/title-ink.png" alt="투데이 내전"><img class="lg-ti two" src="../assets/title/title-two.png" alt="투데이 내전"></div>
      <span class="lg-date" id="lg-date"></span>
      <div class="lg-go" id="lg-go"><i></i><span id="lg-gotx">GAME START</span><i></i></div>
    </div>
  </section>
  <section id="hero">
    <svg class="mk" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5 21.1 6.75v10.5L12 22.5 2.9 17.25V6.75Z" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M12 6.5 16.8 9.25v5.5L12 17.5 7.2 14.75v-5.5Z" fill="currentColor" opacity=".92"/></svg>
    <div class="tt">
      <span class="tt-en">TODAY NAEJEON</span>
      <h1>투데이 내전</h1>
    </div>
    <div class="go" id="go">GAME START</div>
  </section>

  <main id="body">
    <div class="me" id="me"></div>
    <div class="cols">
      <section class="col" id="c-rooms">
        <div class="col-hd"><span class="col-en">ROOMS</span><b>방 목록</b><em id="rooms-n"></em></div>
        <div class="list" id="rooms"></div>
      </section>
      <section class="col" id="c-online">
        <div class="col-hd"><span class="col-en">ONLINE</span><b>접속 중</b><em id="online-n"></em></div>
        <div class="list" id="online"></div>
      </section>
    </div>
    <footer id="foot"></footer>
  </main>
  <script src="../desktop/tip.js"></script>
  <script src="home.js"></script>
</body>
</html>
