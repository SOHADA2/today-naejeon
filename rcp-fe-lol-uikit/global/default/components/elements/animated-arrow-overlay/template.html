<template>
  <div id="animated-arrow-overlay-wrapper">
    <svg id="path-defs" class="svg-container"
      xmlns="http://www.w3.org/2000/svg"
      xmlns:xlink="http://www.w3.org/1999/xlink"
      x="0" y="0" width="100%" height="100%">

      <defs>
        <pattern id="noise-map" x="0" y="0" width="400" height="40" patternUnits="userSpaceOnUse">
          <image xlink:href="/fe/lol-uikit/images/noise-tile-alpha-tint-large.png" x="0" y="0" width="400" height="40"></image>
          <animate dur="20s" repeatCount="indefinite" attributeName="y" values="0;20;0"/>
          <animate dur="40s" repeatCount="indefinite" attributeName="x" values="0;50;0;-50;0"/>
        </pattern>
        <pattern id="noise-map-offset" x="25%" y="0" width="400" height="40" patternUnits="userSpaceOnUse">
          <image xlink:href="/fe/lol-uikit/images/noise-tile-alpha-tint-large.png" x="0" y="0" width="400" height="40"></image>
          <animate dur="20s" repeatCount="indefinite" attributeName="y" values="0;20;0"/>
          <animate dur="40s" repeatCount="indefinite" attributeName="x" values="25;75;25;-25;25"/>
        </pattern>
        <path id="scalable-path"
          d="M0, 0" fill="none" stroke="#fff" stroke-width="2"/>
        <mask id="mask-dashed-border" maskUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
          <use xlink:href="#scalable-path" stroke-width="4" class="dashed-border"/>
        </mask>
        <mask id="mask-dashed-border-offset" maskUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
          <use xlink:href="#scalable-path" stroke-width="4" class="dashed-border offset"/>
        </mask>
      </defs>
    </svg>

    <div id="animated-magic-container">
      <svg id="animated-magic-low" class="svg-container"
        xmlns="http://www.w3.org/2000/svg"
        xmlns:xlink="http://www.w3.org/1999/xlink"
        x="0" y="0" width="100%" height="100%">
        <rect x="0" y="0" width="100%" height="100%" mask="url(#mask-dashed-border)" fill="url(#noise-map)"/>
        <rect x="0" y="0" width="100%" height="100%" mask="url(#mask-dashed-border-offset)" fill="url(#noise-map-offset)"/>
      </svg>
      <svg id="animated-magic-high" class="svg-container"
        xmlns="http://www.w3.org/2000/svg"
        xmlns:xlink="http://www.w3.org/1999/xlink"
        x="0" y="0" width="100%" height="100%">
        <rect x="0" y="0" width="100%" height="100%" mask="url(#mask-dashed-border)" fill="url(#noise-map)"/>
        <rect x="0" y="0" width="100%" height="100%" mask="url(#mask-dashed-border-offset)" fill="url(#noise-map-offset)"/>
      </svg>
    </div>
  </div>
</template>
